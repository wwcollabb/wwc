<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Plans - WinKom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        success: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass-morphism {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        .hover-scale {
            transition: transform 0.3s ease;
        }
        .hover-scale:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    
    <!-- Navigation -->
    <nav class="glass-morphism fixed top-0 w-full z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-2xl font-bold gradient-bg bg-clip-text text-transparent">WinKom</a>
            
            <div class="flex items-center space-x-4">
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
                <a href="dashboard.html" class="hover:text-primary">Dashboard</a>
                <button onclick="logout()" class="bg-danger text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 py-8 pt-24">
        <h1 class="text-4xl font-bold text-center mb-8">Investment Plans</h1>
        
        <div id="plansContainer" class="grid md:grid-cols-3 gap-6">
            <!-- Plans will be rendered here -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY",
            authDomain: "winkom-da4c2.firebaseapp.com",
            projectId: "winkom-da4c2",
            storageBucket: "winkom-da4c2.firebasestorage.app",
            messagingSenderId: "629229462242",
            appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Auth check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            await loadPlans();
        });

        async function loadPlans() {
            try {
                const plansCollection = collection(db, 'plans');
                const plansSnapshot = await getDocs(plansCollection);
                const plans = plansSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                const plansContainer = document.getElementById('plansContainer');
                
                if (plans.length === 0) {
                    plansContainer.innerHTML = '<p class="text-center text-gray-500 col-span-3">No plans available. Please check back later.</p>';
                    return;
                }
                
                plansContainer.innerHTML = plans.map(plan => `
                    <div class="glass-morphism rounded-xl p-6 hover-scale">
                        <h3 class="text-xl font-bold mb-2">${plan.name}</h3>
                        <div class="space-y-2">
                            <p class="text-3xl font-bold text-primary">₹${plan.amount}</p>
                            <p class="text-sm text-gray-600 dark:text-gray-300">Duration: ${plan.duration} days</p>
                            <p class="text-sm text-gray-600 dark:text-gray-300">Daily Return: ${plan.dailyReturn}%</p>
                            <p class="text-lg font-semibold text-success">Total Return: ₹${plan.totalReturn}</p>
                        </div>
                        <a href="deposit.html?plan=${plan.id}" class="mt-4 block text-center bg-primary hover:bg-secondary text-white font-bold py-2 px-4 rounded-lg transition duration-300">
                            Invest Now
                        </a>
                    </div>
                `).join('');
            } catch (error) {
                console.log('Error loading plans');
            }
        }

        window.logout = async () => {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.log('Logout error');
            }
        };

        window.toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        };

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
