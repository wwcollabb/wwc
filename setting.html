<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom — Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2e; --accent:#00d4ff; --accent2:#7c3aed; --text:#e2e8f0; --muted:#94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(17,17,24,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .sidebar { background: var(--card); border-right: 1px solid var(--border); width: 250px; height: calc(100vh - 60px); position: fixed; top: 60px; left: 0; transition: transform 0.3s ease; z-index: 40; }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; color: var(--muted); transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-link:hover { background: rgba(255,255,255,0.05); color: var(--text); border-left-color: var(--accent); }
        .sidebar-link.active { background: rgba(0,212,255,0.1); color: var(--accent); border-left-color: var(--accent); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-bottom: 1.5rem; }
        .input-field { background:#0d0d14; border:1px solid var(--border); border-radius:.75rem; padding:.85rem 1.2rem; width:100%; color:var(--text); font-size:.95rem; outline:none; }
        .input-field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.15); }
        .btn-primary { background:linear-gradient(135deg,#00d4ff,#7c3aed); border:none; border-radius:.75rem; padding:1rem; width:100%; color:#fff; font-weight:700; cursor:pointer; transition:all .3s; box-shadow:0 0 30px rgba(0,212,255,.3); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(0,212,255,.5); }
        .toggle-password { background:none; border:none; color:#666; cursor:pointer; font-size:1.1rem; position:absolute; right:1rem; top:50%; transform:translateY(-50%); }
        .relative-wrap { position:relative; }
        .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="flex items-center gap-3">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white">W</div>
                <span class="font-bold text-lg">WinKom</span>
            </div>
        </div>
        <button id="logoutBtn" class="text-sm text-gray-400 hover:text-white">Logout</button>
    </nav>
    <aside class="sidebar closed" id="sidebar">
        <div class="py-2">
            <a href="index.html" class="sidebar-link">🏠 Dashboard</a>
            <a href="deposit.html" class="sidebar-link">💰 Deposit</a>
            <a href="withdraw.html" class="sidebar-link">🏦 Withdraw</a>
            <a href="settings.html" class="sidebar-link active">⚙️ Settings</a>
            <a href="about.html" class="sidebar-link">ℹ️ About</a>
            <a href="support.html" class="sidebar-link">📞 Support</a>
        </div>
    </aside>
    <main class="flex-1 p-4 md:p-8 md:ml-[250px]" id="mainContent">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Settings</h1>
            <!-- Profile -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Profile</h2>
                <form id="profileForm">
                    <div class="mb-4">
                        <label for="name" class="block text-sm text-gray-400 mb-1">Full Name</label>
                        <input type="text" id="name" class="input-field" required />
                    </div>
                    <button type="submit" class="btn-primary">Update Name</button>
                </form>
            </div>
            <!-- Bank / UPI -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Bank / UPI Details</h2>
                <form id="bankForm">
                    <div class="mb-4">
                        <label for="bankAccount" class="block text-sm text-gray-400 mb-1">Bank Account / UPI ID</label>
                        <input type="text" id="bankAccount" class="input-field" placeholder="e.g., your@upi or account number" required />
                    </div>
                    <button type="submit" class="btn-primary">Save Payment Details</button>
                </form>
            </div>
            <!-- Change Password -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Change Password</h2>
                <form id="passwordForm">
                    <div class="mb-4">
                        <label for="newPassword" class="block text-sm text-gray-400 mb-1">New Password</label>
                        <div class="relative-wrap">
                            <input type="password" id="newPassword" class="input-field" required minlength="6" style="padding-right:3rem;" />
                            <button type="button" class="toggle-password" id="toggleNewPassword">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Change Password</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY", authDomain: "winkom-da4c2.firebaseapp.com", projectId: "winkom-da4c2", storageBucket: "winkom-da4c2.firebasestorage.app", messagingSenderId: "629229462242", appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const logoutBtn = document.getElementById('logoutBtn');
        const profileForm = document.getElementById('profileForm');
        const nameInput = document.getElementById('name');
        const bankForm = document.getElementById('bankForm');
        const bankAccountInput = document.getElementById('bankAccount');
        const passwordForm = document.getElementById('passwordForm');
        const newPasswordInput = document.getElementById('newPassword');
        const toggleNewPassword = document.getElementById('toggleNewPassword');

        function handleResize() {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open'); sidebar.classList.add('closed');
                mainContent.classList.add('md:ml-[250px]'); mainContent.classList.remove('md:ml-0');
            } else {
                sidebar.classList.add('closed'); sidebar.classList.remove('open');
                mainContent.classList.remove('md:ml-[250px]'); mainContent.classList.add('md:ml-0');
            }
        }
        window.addEventListener('resize', handleResize); handleResize();
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('closed'); sidebar.classList.toggle('open');
            if (window.innerWidth > 768) { mainContent.classList.toggle('md:ml-[250px]'); mainContent.classList.toggle('md:ml-0'); }
        });

        let currentUser = null;
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                const data = snap.data();
                nameInput.value = data.name || user.displayName || '';
                bankAccountInput.value = data.bankAccount || data.upi || '';
            }
        });

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const newName = nameInput.value.trim();
            if (!newName) { alert('Name cannot be empty.'); return; }
            try {
                await updateDoc(doc(db, 'users', currentUser.uid), { name: newName });
                await updateProfile(currentUser, { displayName: newName });
                alert('Name updated successfully.');
            } catch (error) { console.error(error); alert('Failed to update name.'); }
        });

        bankForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const account = bankAccountInput.value.trim();
            if (!account) { alert('Please enter bank/UPI details.'); return; }
            try {
                const updateData = account.includes('@') ? { upi: account, bankAccount: null } : { bankAccount: account, upi: null };
                await updateDoc(doc(db, 'users', currentUser.uid), updateData);
                alert('Payment details saved.');
            } catch (error) { console.error(error); alert('Failed to save details.'); }
        });

        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const newPass = newPasswordInput.value;
            if (newPass.length < 6) { alert('Password must be at least 6 characters.'); return; }
            try {
                await updatePassword(currentUser, newPass);
                alert('Password changed successfully.');
                newPasswordInput.value = '';
            } catch (error) { console.error(error); alert('Failed to change password. Please re-login and try again.'); }
        });

        toggleNewPassword.addEventListener('click', () => {
            if (newPasswordInput.type === 'password') { newPasswordInput.type = 'text'; toggleNewPassword.textContent = '🙈'; }
            else { newPasswordInput.type = 'password'; toggleNewPassword.textContent = '👁️'; }
        });

        logoutBtn.addEventListener('click', async () => { await signOut(auth); window.location.href = 'login.html'; });
    </script>
</body>
</html>
