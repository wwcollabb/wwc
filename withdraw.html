<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom — Withdraw</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2e; --accent:#00d4ff; --accent2:#7c3aed; --text:#e2e8f0; --muted:#94a3b8; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(17,17,24,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .sidebar { background: var(--card); border-right: 1px solid var(--border); width: 250px; height: calc(100vh - 60px); position: fixed; top: 60px; left: 0; transition: transform 0.3s ease; z-index: 40; }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; color: var(--muted); transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-link:hover { background: rgba(255,255,255,0.05); color: var(--text); border-left-color: var(--accent); }
        .sidebar-link.active { background: rgba(0,212,255,0.1); color: var(--accent); border-left-color: var(--accent); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; }
        .input-field { background:#0d0d14; border:1px solid var(--border); border-radius:.75rem; padding:.85rem 1.2rem; width:100%; color:var(--text); font-size:.95rem; outline:none; }
        .input-field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.15); }
        .btn-primary { background:linear-gradient(135deg,#00d4ff,#7c3aed); border:none; border-radius:.75rem; padding:1rem; width:100%; color:#fff; font-weight:700; cursor:pointer; transition:all .3s; box-shadow:0 0 30px rgba(0,212,255,.3); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(0,212,255,.5); }
        .table-container { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { padding: 0.75rem 1rem; text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-approved { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .badge-pending { background: rgba(245,158,11,0.1); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
        .badge-rejected { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
        .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="flex items-center gap-3">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white">W</div>
                <span class="font-bold text-lg">WinKom</span>
            </div>
        </div>
        <button id="logoutBtn" class="text-sm text-gray-400 hover:text-white">Logout</button>
    </nav>
    <aside class="sidebar closed" id="sidebar">
        <div class="py-2">
            <a href="index.html" class="sidebar-link">🏠 Dashboard</a>
            <a href="deposit.html" class="sidebar-link">💰 Deposit</a>
            <a href="withdraw.html" class="sidebar-link active">🏦 Withdraw</a>
            <a href="settings.html" class="sidebar-link">⚙️ Settings</a>
            <a href="about.html" class="sidebar-link">ℹ️ About</a>
            <a href="support.html" class="sidebar-link">📞 Support</a>
        </div>
    </aside>
    <main class="flex-1 p-4 md:p-8 md:ml-[250px]" id="mainContent">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Withdrawal Portal</h1>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                <div class="card">
                    <h2 class="text-xl font-semibold mb-4">Request Withdrawal</h2>
                    <form id="withdrawForm">
                        <div class="mb-4">
                            <label for="paymentType" class="block text-sm text-gray-400 mb-1">Payment Method</label>
                            <select id="paymentType" class="input-field">
                                <option value="">Select method</option>
                                <option value="upi">UPI</option>
                                <option value="bank">Bank Account</option>
                            </select>
                        </div>
                        <div id="dynamicFields" class="mb-4"></div>
                        <div class="mb-4">
                            <label for="amount" class="block text-sm text-gray-400 mb-1">Amount (₹) <span class="text-xs text-gray-500">(minimum ₹107)</span></label>
                            <input type="number" id="amount" class="input-field" placeholder="Enter amount" required min="107" />
                        </div>
                        <button type="submit" class="btn-primary">Submit Withdrawal Request</button>
                    </form>
                    <p class="text-sm text-yellow-400 mt-3">Withdrawal processing time: 30 to 60 minutes.</p>
                </div>
                <div class="card">
                    <h2 class="text-xl font-semibold mb-4">Withdrawal History</h2>
                    <div class="table-container">
                        <table>
                            <thead><tr><th>Amount</th><th>Account</th><th>Date</th><th>Status</th></tr></thead>
                            <tbody id="withdrawHistoryBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY", authDomain: "winkom-da4c2.firebaseapp.com", projectId: "winkom-da4c2", storageBucket: "winkom-da4c2.firebasestorage.app", messagingSenderId: "629229462242", appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const logoutBtn = document.getElementById('logoutBtn');
        const withdrawForm = document.getElementById('withdrawForm');
        const paymentTypeSelect = document.getElementById('paymentType');
        const dynamicFields = document.getElementById('dynamicFields');
        const amountInput = document.getElementById('amount');
        const withdrawHistoryBody = document.getElementById('withdrawHistoryBody');

        let currentUser = null;
        let savedPaymentDetails = null;

        function handleResize() {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open'); sidebar.classList.add('closed');
                mainContent.classList.add('md:ml-[250px]'); mainContent.classList.remove('md:ml-0');
            } else {
                sidebar.classList.add('closed'); sidebar.classList.remove('open');
                mainContent.classList.remove('md:ml-[250px]'); mainContent.classList.add('md:ml-0');
            }
        }
        window.addEventListener('resize', handleResize); handleResize();
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('closed'); sidebar.classList.toggle('open');
            if (window.innerWidth > 768) { mainContent.classList.toggle('md:ml-[250px]'); mainContent.classList.toggle('md:ml-0'); }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            const userRef = doc(db, 'users', user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                const data = snap.data();
                if (data.bankAccount) savedPaymentDetails = { type: 'bank', value: data.bankAccount };
                else if (data.upi) savedPaymentDetails = { type: 'upi', value: data.upi };
                if (savedPaymentDetails) {
                    paymentTypeSelect.value = savedPaymentDetails.type;
                    renderDynamicFields(true);
                } else {
                    renderDynamicFields(false);
                }
            }
            loadWithdrawHistory();
        });

        function renderDynamicFields(isSaved) {
            const type = paymentTypeSelect.value;
            if (type === 'upi') {
                dynamicFields.innerHTML = `
                    <label class="block text-sm text-gray-400 mb-1">UPI ID</label>
                    <input type="text" id="upiId" class="input-field" placeholder="yourname@upi" ${isSaved ? 'value="'+savedPaymentDetails.value+'" readonly' : ''} />
                `;
            } else if (type === 'bank') {
                dynamicFields.innerHTML = `
                    <label class="block text-sm text-gray-400 mb-1">Bank Account Number</label>
                    <input type="text" id="bankAccount" class="input-field" placeholder="Enter account number" ${isSaved ? 'value="'+savedPaymentDetails.value+'" readonly' : ''} />
                `;
            } else {
                dynamicFields.innerHTML = '';
            }
        }

        paymentTypeSelect.addEventListener('change', () => renderDynamicFields(false));

        async function loadWithdrawHistory() {
            if (!currentUser) return;
            const wQuery = query(collection(db, 'withdrawals'), where('userId', '==', currentUser.uid));
            const snapshot = await getDocs(wQuery);
            withdrawHistoryBody.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>₹${data.amount}</td>
                    <td>${data.account}</td>
                    <td>${data.createdAt?.toDate().toLocaleDateString()}</td>
                    <td><span class="badge ${data.status === 'approved' ? 'badge-approved' : data.status === 'pending' ? 'badge-pending' : 'badge-rejected'}">${data.status}</span></td>
                `;
                withdrawHistoryBody.appendChild(tr);
            });
        }

        withdrawForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const type = paymentTypeSelect.value;
            const amount = parseFloat(amountInput.value);
            if (!type) { alert('Please select payment method.'); return; }
            if (!amount || amount < 107) { alert('Minimum withdrawal amount is ₹107.'); return; }

            let accountValue = savedPaymentDetails?.value;
            if (!accountValue) {
                if (type === 'upi') {
                    const upiInput = document.getElementById('upiId');
                    accountValue = upiInput?.value.trim();
                    if (!accountValue) { alert('Please enter UPI ID.'); return; }
                } else {
                    const bankInput = document.getElementById('bankAccount');
                    accountValue = bankInput?.value.trim();
                    if (!accountValue) { alert('Please enter bank account number.'); return; }
                }
                // Save to user profile
                const updateData = type === 'upi' ? { upi: accountValue } : { bankAccount: accountValue };
                await updateDoc(doc(db, 'users', currentUser.uid), updateData);
                savedPaymentDetails = { type, value: accountValue };
            }

            try {
                await addDoc(collection(db, 'withdrawals'), {
                    userId: currentUser.uid,
                    account: accountValue,
                    amount,
                    status: 'pending',
                    createdAt: serverTimestamp(),
                    type: 'withdrawal'
                });
                alert('Withdrawal request submitted! Processing time 30-60 minutes.');
                withdrawForm.reset();
                if (savedPaymentDetails) renderDynamicFields(true);
                loadWithdrawHistory();
            } catch (error) { console.error(error); alert('Error submitting withdrawal.'); }
        });

        logoutBtn.addEventListener('click', async () => { await signOut(auth); window.location.href = 'login.html'; });
    </script>
</body>
</html>
