<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — KashRun</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <span class="brand-name">KashRun</span>
        <span class="brand-tagline">Everything Kashmir Needs</span>
      </div>
    </a>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="form-card">
      <h1>Welcome back</h1>
      <p class="form-sub">Log in to track orders and check out faster.</p>
      <div class="form-error" id="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
      </form>
      <p class="form-note">New to KashRun? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Logging in…";
    try {
      const { user } = await krSignIn({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      if (user) await krCartMergeOnLogin(user.id);
      krPostLoginRedirect();
    } catch (err) {
      errorBox.textContent = krFriendlyError(err);
      errorBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
