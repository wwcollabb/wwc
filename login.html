<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WinKom - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0f; font-family: 'Segoe UI', sans-serif; }
        .glow-card { box-shadow: 0 0 40px rgba(34, 211, 238, 0.15), 0 0 80px rgba(34, 211, 238, 0.05); }
        .glow-btn { box-shadow: 0 0 25px rgba(34, 211, 238, 0.4); transition: all 0.3s; }
        .glow-btn:hover { box-shadow: 0 0 45px rgba(34, 211, 238, 0.7); transform: translateY(-2px); }
        .glow-input:focus { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); border-color: #22d3ee; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-in">
        <div class="bg-[#12121a] rounded-2xl p-8 glow-card border border-cyan-500/20">
            <div class="text-center mb-8">
                <img src="logo.png" alt="WinKom Logo" class="mx-auto mb-4 w-20 h-20 rounded-xl" onerror="this.style.display='none'"/>
                <h1 class="text-3xl font-bold text-white">Win<span class="text-cyan-400">Kom</span></h1>
                <p class="text-gray-400 mt-2 text-sm">Welcome Back!</p>
            </div>

            <div id="errorMsg" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 p-3 rounded-lg mb-4 text-sm"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password" autocomplete="current-password"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                </div>

                <button type="submit" id="loginBtn"
                    class="glow-btn w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3 px-4 rounded-lg">
                    Login
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-gray-700"></div>
                <span class="px-4 text-gray-400 text-sm">or</span>
                <div class="flex-1 h-px bg-gray-700"></div>
            </div>

            <button id="googleBtn"
                class="w-full bg-white text-gray-800 font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Login with Google
            </button>

            <p class="text-center mt-6 text-gray-400 text-sm">
                Don't have an account?
                <a href="signup.html" class="text-cyan-400 hover:text-cyan-300 font-semibold">Sign Up</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY",
            authDomain: "winkom-da4c2.firebaseapp.com",
            projectId: "winkom-da4c2",
            storageBucket: "winkom-da4c2.firebasestorage.app",
            messagingSenderId: "629229462242",
            appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.add('hidden');
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Login';
                if (err.code === 'auth/user-not-found') {
                    showError('No account found with this email. Please sign up first.');
                } else if (err.code === 'auth/wrong-password') {
                    showError('Incorrect password. Please try again.');
                } else if (err.code === 'auth/invalid-credential') {
                    showError('Invalid email or password.');
                } else if (err.code === 'auth/invalid-email') {
                    showError('Please enter a valid email address.');
                } else {
                    showError(err.message);
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            hideError();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid,
                        name: user.displayName || 'User',
                        email: user.email,
                        balance: 59,
                        totalEarnings: 0,
                        totalReferralEarnings: 0,
                        referralCode: 'WK' + Math.random().toString(36).substring(2, 10).toUpperCase(),
                        referredBy: null,
                        referralCount: 0,
                        status: 'active',
                        createdAt: serverTimestamp()
                    });
                }

                window.location.href = 'index.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(err.message);
                }
            }
        });
    </script>
</body>
</html>
