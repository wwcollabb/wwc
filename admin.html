<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2e; --accent:#00d4ff; --accent2:#7c3aed; --text:#e2e8f0; --muted:#94a3b8; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(17,17,24,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-bottom: 1.5rem; }
        .input-field { background:#0d0d14; border:1px solid var(--border); border-radius:.75rem; padding:.85rem 1.2rem; width:100%; color:var(--text); font-size:.95rem; outline:none; }
        .input-field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.15); }
        .btn-primary { background:linear-gradient(135deg,#00d4ff,#7c3aed); border:none; border-radius:.75rem; padding:1rem; width:100%; color:#fff; font-weight:700; cursor:pointer; transition:all .3s; box-shadow:0 0 30px rgba(0,212,255,.3); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(0,212,255,.5); }
        .btn-danger { background:#ef4444; border:none; border-radius:.75rem; padding:.5rem 1rem; color:#fff; cursor:pointer; }
        .btn-approve { background:#10b981; border:none; border-radius:.75rem; padding:.5rem 1rem; color:#fff; cursor:pointer; }
        .table-container { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { padding: 0.75rem 1rem; text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-approved { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .badge-pending { background: rgba(245,158,11,0.1); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
        .badge-rejected { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white">W</div>
            <span class="font-bold text-lg">WinKom Admin</span>
        </div>
        <button id="adminLogoutBtn" class="text-sm text-gray-400 hover:text-white">Logout</button>
    </nav>
    <main class="flex-1 p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-bold mb-6">Admin Control Panel</h1>
            <!-- Pending Deposits -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Pending Deposits</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>User</th><th>Amount</th><th>UTR</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="pendingDepositsBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- Pending Withdrawals -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Pending Withdrawals</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>User</th><th>Amount</th><th>Account</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="pendingWithdrawalsBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- Manage Users -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Manage Users</h2>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Balance</th><th>Action</th></tr></thead>
                        <tbody id="usersBody"></tbody>
                    </table>
                </div>
            </div>
            <!-- Create Investment Plan -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4">Create Investment Plan</h2>
                <form id="planForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="planName" class="input-field" placeholder="Plan Name" required />
                    <input type="number" id="planAmount" class="input-field" placeholder="Amount (₹)" required min="1" />
                    <input type="number" id="planDuration" class="input-field" placeholder="Duration (days)" required min="1" />
                    <input type="number" id="planDailyReturn" class="input-field" placeholder="Daily Return (%)" required step="0.01" min="0" />
                    <button type="submit" class="btn-primary md:col-span-2">Create Plan</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, query, where, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY", authDomain: "winkom-da4c2.firebaseapp.com", projectId: "winkom-da4c2", storageBucket: "winkom-da4c2.firebasestorage.app", messagingSenderId: "629229462242", appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const pendingDepositsBody = document.getElementById('pendingDepositsBody');
        const pendingWithdrawalsBody = document.getElementById('pendingWithdrawalsBody');
        const usersBody = document.getElementById('usersBody');
        const planForm = document.getElementById('planForm');
        const adminLogoutBtn = document.getElementById('adminLogoutBtn');

        onAuthStateChanged(auth, async (user) => {
            if (!user || user.email !== 'Admin@wk.in') {
                alert('Access denied. Admin only.');
                window.location.href = 'login.html';
                return;
            }
            loadAdminData();
        });

        async function loadAdminData() {
            const depQuery = query(collection(db, 'deposits'), where('status', '==', 'pending'));
            const depSnapshot = await getDocs(depQuery);
            pendingDepositsBody.innerHTML = '';
            depSnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.userId}</td>
                    <td>₹${data.amount}</td>
                    <td>${data.utr}</td>
                    <td>${data.createdAt?.toDate().toLocaleDateString()}</td>
                    <td>
                        <button class="btn-approve approveDeposit" data-id="${docSnap.id}">Approve</button>
                        <button class="btn-danger rejectDeposit" data-id="${docSnap.id}">Reject</button>
                    </td>
                `;
                pendingDepositsBody.appendChild(tr);
            });

            const wQuery = query(collection(db, 'withdrawals'), where('status', '==', 'pending'));
            const wSnapshot = await getDocs(wQuery);
            pendingWithdrawalsBody.innerHTML = '';
            wSnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.userId}</td>
                    <td>₹${data.amount}</td>
                    <td>${data.account}</td>
                    <td>${data.createdAt?.toDate().toLocaleDateString()}</td>
                    <td>
                        <button class="btn-approve approveWithdrawal" data-id="${docSnap.id}">Approve</button>
                        <button class="btn-danger rejectWithdrawal" data-id="${docSnap.id}">Reject</button>
                    </td>
                `;
                pendingWithdrawalsBody.appendChild(tr);
            });

            const usersSnapshot = await getDocs(collection(db, 'users'));
            usersBody.innerHTML = '';
            usersSnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.name || 'N/A'}</td>
                    <td>${data.email}</td>
                    <td><span class="badge ${data.status === 'active' ? 'badge-approved' : 'badge-rejected'}">${data.status}</span></td>
                    <td>₹${data.balance || 0}</td>
                    <td><button class="btn-danger toggleUser" data-id="${docSnap.id}" data-status="${data.status}">${data.status === 'active' ? 'Block' : 'Activate'}</button></td>
                `;
                usersBody.appendChild(tr);
            });

            document.querySelectorAll('.approveDeposit').forEach(btn => btn.addEventListener('click', approveDeposit));
            document.querySelectorAll('.rejectDeposit').forEach(btn => btn.addEventListener('click', rejectDeposit));
            document.querySelectorAll('.approveWithdrawal').forEach(btn => btn.addEventListener('click', approveWithdrawal));
            document.querySelectorAll('.rejectWithdrawal').forEach(btn => btn.addEventListener('click', rejectWithdrawal));
            document.querySelectorAll('.toggleUser').forEach(btn => btn.addEventListener('click', toggleUserStatus));
        }

        async function approveDeposit(e) {
            const id = e.target.dataset.id;
            const depRef = doc(db, 'deposits', id);
            const depSnap = await getDoc(depRef);
            const data = depSnap.data();
            await updateDoc(depRef, { status: 'approved' });
            const userRef = doc(db, 'users', data.userId);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                await updateDoc(userRef, { balance: (userData.balance || 0) + data.amount });
            }
            loadAdminData();
        }

        async function rejectDeposit(e) {
            const id = e.target.dataset.id;
            await updateDoc(doc(db, 'deposits', id), { status: 'rejected' });
            loadAdminData();
        }

        async function approveWithdrawal(e) {
            const id = e.target.dataset.id;
            const wRef = doc(db, 'withdrawals', id);
            const wSnap = await getDoc(wRef);
            const data = wSnap.data();
            await updateDoc(wRef, { status: 'approved' });
            const userRef = doc(db, 'users', data.userId);
            const userSnap = await getDoc(userRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                const newBalance = Math.max(0, (userData.balance || 0) - data.amount);
                await updateDoc(userRef, { balance: newBalance });
            }
            loadAdminData();
        }

        async function rejectWithdrawal(e) {
            const id = e.target.dataset.id;
            await updateDoc(doc(db, 'withdrawals', id), { status: 'rejected' });
            loadAdminData();
        }

        async function toggleUserStatus(e) {
            const id = e.target.dataset.id;
            const currentStatus = e.target.dataset.status;
            const newStatus = currentStatus === 'active' ? 'blocked' : 'active';
            await updateDoc(doc(db, 'users', id), { status: newStatus });
            loadAdminData();
        }

        planForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('planName').value.trim();
            const amount = parseFloat(document.getElementById('planAmount').value);
            const duration = parseInt(document.getElementById('planDuration').value);
            const dailyReturn = parseFloat(document.getElementById('planDailyReturn').value);
            if (!name || !amount || !duration || !dailyReturn) { alert('Please fill all fields.'); return; }
            try {
                await addDoc(collection(db, 'plans'), { name, amount, duration, dailyReturn, active: true, createdAt: serverTimestamp() });
                alert('Investment plan created!');
                planForm.reset();
            } catch (error) { console.error(error); alert('Failed to create plan.'); }
        });

        adminLogoutBtn.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
