<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — KashRun</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .pay-option{display:flex;align-items:center;gap:10px;border:1px solid var(--stone-200);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px}
  .pay-option.disabled{opacity:.5}
  .pin-status{margin-top:8px}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text"><span class="brand-name">KashRun</span><span class="brand-tagline">Everything Kashmir Needs</span></div>
    </a>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 class="page-title" style="font-size:1.8rem">Checkout</h1>
    <div id="checkout-root"><div class="spinner"></div></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom" style="border-top:none;margin-top:0">© 2026 KashRun. Serving Jammu &amp; Kashmir.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script>
  const DELIVERY_CHARGE = 40;
  let pinValid = false;
  let cartItems = [];

  async function init() {
    const user = await krRequireAuth();
    if (!user) return; // krRequireAuth already redirected to login with ?next

    cartItems = (await krCartFetchDetailed()).filter(i => i.product && i.product.is_active !== false);
    const root = document.getElementById("checkout-root");

    if (cartItems.length === 0) {
      root.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><p>Add products before checking out.</p><a href="products.html" class="btn btn-primary" style="margin-top:16px">Browse Products</a></div>`;
      return;
    }

    const subtotal = cartItems.reduce((s, i) => s + i.product.price * i.quantity, 0);
    const total = subtotal + DELIVERY_CHARGE;

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          <div class="card" style="margin-bottom:20px">
            <h3 style="margin-bottom:16px">Delivery Address</h3>
            <div class="form-error" id="checkout-error"></div>
            <form id="address-form">
              <div class="field"><label>Full Name</label><input type="text" id="f-name" required></div>
              <div class="field"><label>Mobile Number</label><input type="tel" id="f-mobile" pattern="[0-9]{10}" maxlength="10" required></div>
              <div class="field"><label>House / Building</label><input type="text" id="f-house" required></div>
              <div class="field"><label>Area / Locality</label><input type="text" id="f-area" required></div>
              <div class="field-row">
                <div class="field"><label>City</label><input type="text" id="f-city" required></div>
                <div class="field"><label>District</label><input type="text" id="f-district" value="Kulgam" required></div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label>PIN Code</label>
                  <input type="text" id="f-pincode" inputmode="numeric" maxlength="6" required>
                  <div class="pin-status" id="pin-status"></div>
                </div>
                <div class="field"><label>State</label><input type="text" id="f-state" value="Jammu & Kashmir" readonly></div>
              </div>
            </form>
          </div>

          <div class="card">
            <h3 style="margin-bottom:14px">Payment Method</h3>
            <label class="pay-option">
              <input type="radio" name="pay" value="cod" checked>
              <div><strong>Cash on Delivery</strong><div style="font-size:.8rem;color:var(--stone)">Pay when your order arrives</div></div>
            </label>
            <label class="pay-option disabled">
              <input type="radio" name="pay" value="online" disabled>
              <div><strong>Online Payment</strong><div style="font-size:.8rem;color:var(--stone)">Coming soon</div></div>
            </label>
          </div>
        </div>

        <div class="summary-card">
          <h3 style="margin-bottom:14px">Order Summary</h3>
          ${cartItems.map(i => `<div class="summary-row"><span>${i.product.name} × ${i.quantity}</span><span>${krFormatPrice(i.product.price * i.quantity)}</span></div>`).join("")}
          <div class="summary-row"><span>Delivery</span><span>${krFormatPrice(DELIVERY_CHARGE)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${krFormatPrice(total)}</span></div>
          <button class="btn btn-accent btn-block" id="place-order-btn" style="margin-top:16px" disabled>Enter a serviceable PIN code</button>
        </div>
      </div>
    `;

    wireEvents(total);
  }

  function wireEvents(total) {
    const pinInput = document.getElementById("f-pincode");
    const pinStatus = document.getElementById("pin-status");
    const placeBtn = document.getElementById("place-order-btn");

    async function checkPin() {
      const val = pinInput.value.trim();
      if (val.length !== 6) {
        pinValid = false;
        placeBtn.disabled = true;
        placeBtn.textContent = "Enter a serviceable PIN code";
        pinStatus.innerHTML = "";
        return;
      }
      pinStatus.innerHTML = `<div class="spinner" style="margin:8px 0;width:16px;height:16px"></div>`;
      const check = await krCheckPincode(val);
      if (check.valid) {
        pinValid = true;
        pinStatus.innerHTML = `<span class="stamp stamp-ok">Delivery available at this PIN code</span>`;
        placeBtn.disabled = false;
        placeBtn.textContent = `Place Order — ${krFormatPrice(total)}`;
      } else {
        pinValid = false;
        pinStatus.innerHTML = `<span class="stamp stamp-no">Sorry, KashRun delivery is currently unavailable at this PIN code.</span>`;
        placeBtn.disabled = true;
        placeBtn.textContent = "Delivery unavailable at this PIN code";
      }
    }
    pinInput.addEventListener("blur", checkPin);
    pinInput.addEventListener("input", () => { if (pinInput.value.length === 6) checkPin(); });

    document.getElementById("place-order-btn").addEventListener("click", async () => {
      const errorBox = document.getElementById("checkout-error");
      errorBox.style.display = "none";

      const form = document.getElementById("address-form");
      if (!form.reportValidity()) return;
      if (!pinValid) return; // server-side RPC re-checks this regardless

      const address = {
        full_name: document.getElementById("f-name").value.trim(),
        mobile: document.getElementById("f-mobile").value.trim(),
        house: document.getElementById("f-house").value.trim(),
        area: document.getElementById("f-area").value.trim(),
        city: document.getElementById("f-city").value.trim(),
        district: document.getElementById("f-district").value.trim(),
        pincode: document.getElementById("f-pincode").value.trim(),
        state: "Jammu & Kashmir",
      };
      const paymentMethod = document.querySelector('input[name="pay"]:checked').value;

      placeBtn.disabled = true;
      placeBtn.textContent = "Placing order…";
      try {
        await krSaveAddress(address);
        const orderId = await krPlaceOrder({ address, paymentMethod, items: cartItems });
        window.location.href = `order-details.html?id=${orderId}&placed=1`;
      } catch (err) {
        errorBox.textContent = err.friendly || krFriendlyError(err);
        errorBox.style.display = "block";
        placeBtn.disabled = false;
        placeBtn.textContent = `Place Order — ${krFormatPrice(total)}`;
      }
    });
  }

  init();
</script>
</body>
</html>
