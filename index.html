<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2e; --accent:#00d4ff; --accent2:#7c3aed; --text:#e2e8f0; --muted:#94a3b8; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(17,17,24,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        .sidebar { background: var(--card); border-right: 1px solid var(--border); width: 250px; height: calc(100vh - 60px); position: fixed; top: 60px; left: 0; transition: transform 0.3s ease; z-index: 40; overflow-y: auto; }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar.open { transform: translateX(0); }
        .sidebar-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; color: var(--muted); transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-link:hover { background: rgba(255,255,255,0.05); color: var(--text); border-left-color: var(--accent); }
        .sidebar-link.active { background: rgba(0,212,255,0.1); color: var(--accent); border-left-color: var(--accent); }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; transition: all 0.3s; }
        .stat-card:hover { border-color: var(--accent); box-shadow: 0 0 30px rgba(0,212,255,0.1); }
        .plan-card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; transition: all 0.3s; }
        .plan-card:hover { border-color: var(--accent); box-shadow: 0 0 40px rgba(0,212,255,0.15); }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .progress-bar { height: 8px; background: #1e1e2e; border-radius: 9999px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 9999px; }
        .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="flex items-center gap-3">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center font-bold text-white">W</div>
                <span class="font-bold text-lg">WinKom</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="userNameDisplay" class="hidden sm:block text-sm font-medium"></span>
            <button id="logoutBtn" class="text-sm text-gray-400 hover:text-white transition">Logout</button>
        </div>
    </nav>
    <aside class="sidebar closed" id="sidebar">
        <div class="py-2">
            <a href="index.html" class="sidebar-link active">🏠 Dashboard</a>
            <a href="deposit.html" class="sidebar-link">💰 Deposit</a>
            <a href="withdraw.html" class="sidebar-link">🏦 Withdraw</a>
            <a href="settings.html" class="sidebar-link">⚙️ Settings</a>
            <a href="about.html" class="sidebar-link">ℹ️ About</a>
            <a href="support.html" class="sidebar-link">📞 Support</a>
        </div>
    </aside>
    <main class="flex-1 p-4 md:p-8 md:ml-[250px] transition-all duration-300" id="mainContent">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold mb-6">Dashboard</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                <div class="stat-card">
                    <p class="text-sm text-gray-400">Total Balance</p>
                    <p class="text-2xl font-bold text-white" id="totalBalance">₹0</p>
                </div>
                <div class="stat-card">
                    <p class="text-sm text-gray-400">Active Investments</p>
                    <p class="text-2xl font-bold text-white" id="activeInvestments">0</p>
                </div>
                <div class="stat-card">
                    <p class="text-sm text-gray-400">Referral Earnings</p>
                    <p class="text-2xl font-bold text-white" id="referralEarnings">₹0</p>
                </div>
            </div>
            <h2 class="text-xl font-semibold mb-4">Available Investment Plans</h2>
            <div id="plansContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <h2 class="text-xl font-semibold mt-8 mb-4">Your Active Investments</h2>
            <div id="activeInvestmentsContainer" class="space-y-4"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY", authDomain: "winkom-da4c2.firebaseapp.com", projectId: "winkom-da4c2", storageBucket: "winkom-da4c2.firebasestorage.app", messagingSenderId: "629229462242", appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const logoutBtn = document.getElementById('logoutBtn');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const totalBalanceEl = document.getElementById('totalBalance');
        const activeInvestmentsEl = document.getElementById('activeInvestments');
        const referralEarningsEl = document.getElementById('referralEarnings');
        const plansContainer = document.getElementById('plansContainer');
        const activeInvestmentsContainer = document.getElementById('activeInvestmentsContainer');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
            if (window.innerWidth > 768) {
                mainContent.classList.toggle('md:ml-[250px]');
                mainContent.classList.toggle('md:ml-0');
            }
        });

        function handleResize() {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open'); sidebar.classList.add('closed');
                mainContent.classList.add('md:ml-[250px]'); mainContent.classList.remove('md:ml-0');
            } else {
                sidebar.classList.add('closed'); sidebar.classList.remove('open');
                mainContent.classList.remove('md:ml-[250px]'); mainContent.classList.add('md:ml-0');
            }
        }
        window.addEventListener('resize', handleResize); handleResize();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDocRef = doc(db, 'users', user.uid);
            const userSnap = await getDoc(userDocRef);
            if (userSnap.exists()) {
                const userData = userSnap.data();
                userNameDisplay.textContent = userData.name || user.email;
                totalBalanceEl.textContent = `₹${(userData.balance || 0).toFixed(2)}`;
                referralEarningsEl.textContent = `₹${(userData.referralEarnings || 0).toFixed(2)}`;
            }
            // Fetch plans
            const plansQuery = query(collection(db, 'plans'), where('active', '==', true));
            const plansSnapshot = await getDocs(plansQuery);
            plansContainer.innerHTML = '';
            plansSnapshot.forEach((doc) => {
                const plan = doc.data();
                const planCard = document.createElement('div');
                planCard.className = 'plan-card';
                planCard.innerHTML = `
                    <h3 class="font-bold text-lg mb-2">${plan.name}</h3>
                    <p class="text-sm text-gray-400">Amount: ₹${plan.amount}</p>
                    <p class="text-sm text-gray-400">Duration: ${plan.duration} days</p>
                    <p class="text-sm text-gray-400">Daily Return: ${plan.dailyReturn}%</p>
                    <button class="mt-4 w-full py-2 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-lg font-semibold hover:shadow-lg transition">Invest</button>
                `;
                plansContainer.appendChild(planCard);
            });
            // Fetch active investments
            const invQuery = query(collection(db, 'investments'), where('userId', '==', user.uid), where('status', '==', 'active'));
            const invSnapshot = await getDocs(invQuery);
            activeInvestmentsEl.textContent = invSnapshot.size;
            activeInvestmentsContainer.innerHTML = '';
            invSnapshot.forEach((doc) => {
                const inv = doc.data();
                const daysPassed = Math.floor((Date.now() - inv.startDate.toDate()) / (1000*60*60*24));
                const totalDays = inv.duration;
                const progress = Math.min(100, (daysPassed / totalDays) * 100);
                const invCard = document.createElement('div');
                invCard.className = 'stat-card';
                invCard.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold">${inv.planName}</span>
                        <span class="badge badge-active">Active</span>
                    </div>
                    <p class="text-sm text-gray-400">Invested: ₹${inv.amount}</p>
                    <p class="text-sm text-gray-400">Daily Return: ${inv.dailyReturn}%</p>
                    <div class="progress-bar mt-2"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <p class="text-xs text-gray-500 mt-1">Day ${daysPassed}/${totalDays}</p>
                `;
                activeInvestmentsContainer.appendChild(invCard);
            });
        });

        logoutBtn.addEventListener('click', async () => { await signOut(auth); window.location.href = 'login.html'; });
    </script>
</body>
</html>
