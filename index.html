<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom - Smart Investment Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass-morphism {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        .hover-scale {
            transition: transform 0.3s ease;
        }
        .hover-scale:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
    
    <!-- Navigation -->
    <nav class="glass-morphism fixed top-0 w-full z-40 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold gradient-bg bg-clip-text text-transparent">WinKom</a>
            
            <div class="flex items-center space-x-4">
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:inline">☀️</span>
                </button>
                
                <a href="about.html" class="hover:text-primary">About</a>
                <a href="support.html" class="hover:text-primary">Support</a>
                <a href="login.html" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary transition">Login</a>
                <a href="signup.html" class="bg-success text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="min-h-screen flex items-center justify-center px-4 pt-20">
        <div class="text-center max-w-4xl">
            <h1 class="text-5xl md:text-6xl font-bold mb-6">
                Smart Investments for
                <span class="gradient-bg bg-clip-text text-transparent">Smart People</span>
            </h1>
            <p class="text-xl text-gray-600 dark:text-gray-400 mb-8">
                Join WinKom and start your journey to financial freedom today.
                Secure, transparent, and profitable investment platform.
            </p>
            <div class="flex justify-center space-x-4">
                <a href="signup.html" class="gradient-bg text-white font-bold py-3 px-8 rounded-lg hover:opacity-90 transition text-lg">
                    Get Started
                </a>
                <a href="about.html" class="glass-morphism font-bold py-3 px-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition text-lg">
                    Learn More
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        
        // Check auth state
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
        }
    </script>
</body>
</html>
