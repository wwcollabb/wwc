<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e, #0f3460);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .4;
            z-index: 0;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #6c63ff;
            top: -80px;
            left: -60px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #00d4ff;
            bottom: -60px;
            right: -40px;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: #ff6584;
            top: 60%;
            left: 70%;
            animation-delay: 4s;
        }

        @keyframes floatOrb {
            0% {
                transform: translateY(0) scale(1);
            }
            100% {
                transform: translateY(-40px) scale(1.08);
            }
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 24px;
            padding: 60px 70px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .1);
            max-width: 520px;
            width: 90%;
        }

        .icon-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .icon-wrapper .gear {
            position: absolute;
            font-size: 55px;
            line-height: 100px;
            animation: spin 4s linear infinite;
        }

        .icon-wrapper .gear-big {
            font-size: 70px;
            top: -5px;
            left: 15px;
            color: #6c63ff;
            filter: drop-shadow(0 0 15px rgba(108, 99, 255, .6));
        }

        .icon-wrapper .gear-small {
            font-size: 35px;
            bottom: 5px;
            right: 0;
            color: #00d4ff;
            animation-direction: reverse;
            animation-duration: 3s;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, .5));
        }

        .icon-wrapper .wrench {
            position: absolute;
            font-size: 28px;
            bottom: 15px;
            left: 10px;
            animation: bounce 2s ease infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #d0d0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -.5px;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card p {
            color: rgba(255, 255, 255, .7);
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, .1);
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            border-radius: 20px;
            background: linear-gradient(90deg, #6c63ff, #00d4ff, #6c63ff);
            background-size: 200% 100%;
            animation: progress 2.5s ease-in-out infinite alternate, shimmer 1.5s ease infinite;
        }

        @keyframes progress {
            0% {
                width: 10%;
            }
            100% {
                width: 90%;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* Time display */
        .eta {
            font-size: .8rem;
            color: rgba(255, 255, 255, .5);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Social / Contact */
        .contact-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .contact-row a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            color: rgba(255, 255, 255, .8);
            font-size: 16px;
            text-decoration: none;
            transition: all .3s ease;
        }

        .contact-row a:hover {
            background: rgba(108, 99, 255, .3);
            border-color: #6c63ff;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(108, 99, 255, .3);
        }

        /* Divider */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .4), transparent);
            margin: 25px auto;
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 40px 30px;
                border-radius: 16px;
            }
            .card h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Decorative Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main Card -->
    <div class="card">
        <div class="icon-wrapper">
            <span class="gear gear-big">⚙️</span>
            <span class="gear gear-small">⚙️</span>
            <span class="wrench">🔧</span>
        </div>

        <h1>Site Upgrade<br>In Progress</h1>
        <p>We're working hard to bring you something amazing. This won't take long!</p>

        <div class="eta">⏱ Estimated time: 1-12 hours</div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="divider"></div>

        <div class="contact-row">
            <a href="#" title="Twitter">🐦</a>
            <a href="#" title="Email">✉️</a>
            <a href="#" title="GitHub">💻</a>
            <a href="#" title="Instagram">📷</a>
        </div>
    </div>

</body>
</html>
