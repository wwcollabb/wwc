<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — KashRun</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text"><span class="brand-name">KashRun</span><span class="brand-tagline">Everything Kashmir Needs</span></div>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" aria-label="Cart">🛍<span class="icon-badge" data-cart-count style="display:none">0</span></a>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 class="page-title" style="font-size:1.8rem">My Account</h1>
    <nav class="account-nav">
      <a href="account.html" class="active">Profile</a>
      <a href="orders.html">My Orders</a>
      <a href="wishlist.html">Wishlist</a>
    </nav>
    <div id="account-root" class="grid-2"><div class="spinner"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/checkout.js"></script>
<script src="js/cart.js"></script>
<script>
  async function init() {
    const user = await krRequireAuth();
    if (!user) return;

    const { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
    const addresses = await krFetchAddresses();

    document.getElementById("account-root").innerHTML = `
      <div class="card">
        <h3 style="margin-bottom:16px">Profile</h3>
        <div class="field"><label>Name</label><input type="text" value="${profile?.full_name || ""}" readonly></div>
        <div class="field"><label>Email</label><input type="text" value="${user.email || ""}" readonly></div>
        <div class="field"><label>Phone</label><input type="text" value="${profile?.phone || "—"}" readonly></div>
        <button class="btn btn-outline btn-block" id="logout-btn">Log Out</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:16px">Saved Addresses</h3>
        ${addresses.length ? addresses.map(a => `
          <div style="padding:12px 0;border-bottom:1px solid var(--stone-200);font-size:.9rem">
            <strong>${a.full_name}</strong> — ${a.mobile}<br>
            ${a.house}, ${a.area}, ${a.city}, ${a.district} – ${a.pincode}
          </div>`).join("")
          : `<p style="color:var(--stone);font-size:.9rem">No saved addresses yet — they're added automatically at checkout.</p>`}
      </div>
    `;
    document.getElementById("logout-btn").addEventListener("click", krSignOut);
  }
  init();
</script>
</body>
</html>
