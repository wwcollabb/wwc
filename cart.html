<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — KashRun</title>
<link rel="icon" href="assets/logo.png">
<style>
/* ==========================================================
   KashRun — Design System
   Palette: ink #121212, paper #FAF8F4, saffron #FF6A13,
            rust #C2410C, valley #2F5233, stone #6B6B6B
   Type: Fraunces (display) / Inter (body) / IBM Plex Mono (data)
   Signature: the "serviceability stamp" — a perforated postal
   seal used for PIN status, order status & badges throughout.
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#121212;
  --ink-soft:#2a2a2a;
  --paper:#FAF8F4;
  --paper-dim:#F1EDE5;
  --card:#ffffff;
  --saffron:#FF6A13;
  --rust:#C2410C;
  --valley:#2F5233;
  --valley-bg:#EAF0EA;
  --danger:#B3261E;
  --danger-bg:#FBEAEA;
  --stone:#6B6B6B;
  --stone-200:#E4E0D8;
  --stone-100:#EFEBE3;
  --radius:14px;
  --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(18,18,18,.06);
  --shadow-md:0 6px 20px rgba(18,18,18,.08);
  --shadow-lg:0 16px 40px rgba(18,18,18,.14);
  --maxw:1200px;
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.container{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:.95rem;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-soft)}
.btn-accent{background:var(--saffron);color:#fff}
.btn-accent:hover{background:var(--rust)}
.btn-outline{background:transparent;border-color:var(--stone-200);color:var(--ink)}
.btn-outline:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-block{width:100%}
.btn-sm{padding:8px 16px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;background:rgba(250,248,244,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--stone-200);
}
.header-top{display:flex;align-items:center;gap:20px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand img{height:38px;width:38px;object-fit:contain;border-radius:8px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:.2px}
.brand-tagline{font-size:.68rem;color:var(--stone);text-transform:uppercase;letter-spacing:.08em}
.header-search{flex:1;max-width:560px;margin:0 auto;position:relative;display:none}
.header-search input{
  width:100%;padding:11px 44px 11px 16px;border-radius:999px;border:1px solid var(--stone-200);
  background:var(--card);font-size:.92rem;
}
.header-search button{
  position:absolute;right:4px;top:4px;bottom:4px;aspect-ratio:1;border-radius:50%;
  border:none;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{
  position:relative;width:40px;height:40px;border-radius:50%;border:1px solid transparent;
  background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.icon-btn:hover{background:var(--paper-dim)}
.icon-badge{
  position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 3px;border-radius:999px;
  background:var(--saffron);color:#fff;font-size:.62rem;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.header-search-mobile{display:block;padding:0 0 12px}
.header-search-mobile input{width:100%;padding:11px 44px 11px 16px;border-radius:999px;border:1px solid var(--stone-200);background:var(--card);font-size:.92rem}
.header-search-mobile{position:relative}
.header-search-mobile button{position:absolute;right:4px;top:4px;bottom:4px;aspect-ratio:1;border-radius:50%;border:none;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}

@media (min-width:860px){
  .header-search{display:block}
  .header-search-mobile{display:none}
}

/* ---------- Serviceability stamp (signature element) ---------- */
.stamp{
  --stamp-color:var(--stone);
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 14px 7px 10px;border-radius:999px;
  border:1.5px dashed var(--stamp-color);
  color:var(--stamp-color);
  font-family:var(--font-mono);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:transparent;
}
.stamp::before{
  content:'';width:8px;height:8px;border-radius:50%;background:var(--stamp-color);flex-shrink:0;
}
.stamp-ok{--stamp-color:var(--valley);background:var(--valley-bg)}
.stamp-no{--stamp-color:var(--danger);background:var(--danger-bg)}
.stamp-pending{--stamp-color:var(--saffron);background:#FFF1E6}

/* ---------- Hero ---------- */
.hero{position:relative;padding:56px 0 64px;overflow:hidden;background:var(--ink);color:#fff}
.hero::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle, rgba(255,255,255,.14) 1.5px, transparent 1.5px);
  background-size:16px 16px;opacity:.35;pointer-events:none;
}
.hero-inner{position:relative;display:flex;flex-direction:column;gap:18px;max-width:640px}
.hero-eyebrow{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--saffron)}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);color:#fff}
.hero p{color:#D8D3C8;font-size:1.05rem;max-width:46ch}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.hero-pin-check{
  margin-top:18px;display:flex;gap:8px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);padding:8px;border-radius:999px;max-width:380px;
}
.hero-pin-check input{
  flex:1;background:transparent;border:none;color:#fff;padding:8px 12px;font-family:var(--font-mono);letter-spacing:.05em;
}
.hero-pin-check input::placeholder{color:#9c968a}
.hero-pin-check button{border-radius:999px;padding:8px 18px}
.hero-pin-result{margin-top:10px}

/* ---------- Sections ---------- */
.section{padding:48px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px}
.section-head h2{font-size:clamp(1.4rem,3vw,1.9rem)}
.section-head a{font-size:.85rem;font-weight:600;color:var(--saffron)}

/* ---------- Categories ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.cat-card{
  background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);
  padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:box-shadow .15s ease, transform .15s ease;
}
.cat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cat-icon{width:44px;height:44px;border-radius:50%;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.cat-card span{font-size:.85rem;font-weight:600}

/* ---------- Product cards ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.prod-card{
  background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;position:relative;transition:box-shadow .15s ease, transform .15s ease;
}
.prod-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.prod-thumb{aspect-ratio:1;background:var(--paper-dim);position:relative;overflow:hidden}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.prod-wish{
  position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);
}
.prod-wish.active{color:var(--rust)}
.prod-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod-name{font-size:.9rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-meta{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--stone)}
.prod-price{font-family:var(--font-mono);font-weight:600;font-size:1rem;margin-top:auto}
.prod-price .strike{color:var(--stone);text-decoration:line-through;font-weight:500;font-size:.8rem;margin-left:6px}
.prod-add{margin-top:6px}
.rating{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;color:var(--ink);background:var(--valley-bg);padding:2px 6px;border-radius:6px}

/* ---------- Filters / sidebar ---------- */
.listing-layout{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.listing-layout{grid-template-columns:230px 1fr}}
.filters{background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);padding:18px;align-self:start;position:sticky;top:90px}
.filters h3{font-size:.95rem;margin-bottom:12px}
.filter-group{margin-bottom:20px}
.filter-group label{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:5px 0;color:var(--ink-soft)}
.listing-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.select{
  padding:9px 14px;border-radius:999px;border:1px solid var(--stone-200);background:var(--card);font-size:.85rem;font-weight:600;
}

/* ---------- Forms ---------- */
.form-card{background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);padding:28px;max-width:440px;margin:0 auto;box-shadow:var(--shadow-sm)}
.form-card h1{font-size:1.6rem;margin-bottom:4px}
.form-sub{color:var(--stone);font-size:.9rem;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);border:1px solid var(--stone-200);background:var(--paper);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--saffron);background:#fff}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:.85rem;margin-bottom:14px;display:none}
.form-note{font-size:.85rem;color:var(--stone);margin-top:16px;text-align:center}
.form-note a{color:var(--saffron);font-weight:600}

/* ---------- Cart ---------- */
.cart-layout{display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.cart-layout{grid-template-columns:1fr 320px}}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--stone-200)}
.cart-item img{width:78px;height:78px;border-radius:var(--radius-sm);object-fit:cover;background:var(--paper-dim)}
.cart-item-body{flex:1;display:flex;flex-direction:column;gap:6px}
.qty-control{display:inline-flex;align-items:center;border:1px solid var(--stone-200);border-radius:999px;overflow:hidden;width:fit-content}
.qty-control button{width:30px;height:30px;background:var(--paper-dim);border:none;font-weight:700}
.qty-control span{width:34px;text-align:center;font-family:var(--font-mono);font-size:.9rem}
.summary-card{background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);padding:20px;align-self:start;position:sticky;top:90px}
.summary-row{display:flex;justify-content:space-between;font-size:.9rem;padding:7px 0}
.summary-row.total{border-top:1px solid var(--stone-200);margin-top:8px;padding-top:14px;font-weight:700;font-size:1.05rem}

/* ---------- Order status timeline / badges ---------- */
.status-badge{font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:5px 10px;border-radius:999px;display:inline-block}
.status-placed,.status-confirmed{background:#FFF1E6;color:var(--rust)}
.status-packed,.status-shipped,.status-out_for_delivery{background:#EAF0EA;color:var(--valley)}
.status-delivered{background:var(--ink);color:#fff}
.status-cancelled,.status-returned{background:var(--danger-bg);color:var(--danger)}

/* ---------- Cards / misc ---------- */
.card{background:var(--card);border:1px solid var(--stone-200);border-radius:var(--radius);padding:20px}
.empty-state{text-align:center;padding:60px 20px;color:var(--stone)}
.empty-state h3{color:var(--ink);margin-bottom:8px}
.spinner{width:22px;height:22px;border:3px solid var(--stone-200);border-top-color:var(--saffron);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.88rem;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Footer ---------- */
.site-footer{background:var(--ink);color:#D8D3C8;padding:52px 0 24px;margin-top:60px}
.footer-grid{display:grid;grid-template-columns:1fr;gap:32px}
@media (min-width:700px){.footer-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.footer-brand{font-family:var(--font-display);font-size:1.3rem;color:#fff}
.footer-tag{font-size:.8rem;color:#9c968a;margin-top:6px}
.footer-col h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:#9c968a;margin-bottom:14px}
.footer-col ul li{margin-bottom:9px;font-size:.87rem}
.footer-col a:hover{color:var(--saffron)}
.footer-bottom{border-top:1px solid #2c2c2c;margin-top:36px;padding-top:20px;font-size:.78rem;color:#7a7568;text-align:center}

/* ---------- Breadcrumb / util ---------- */
.crumbs{font-size:.8rem;color:var(--stone);margin-bottom:18px}
.crumbs a{color:var(--stone)}
.crumbs a:hover{color:var(--ink)}
.page-title{margin-bottom:22px}
.grid-2{display:grid;grid-template-columns:1fr;gap:32px}
@media (min-width:860px){.grid-2{grid-template-columns:1fr 1fr}}
.account-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.account-nav a{padding:9px 16px;border-radius:999px;border:1px solid var(--stone-200);font-size:.85rem;font-weight:600}
.account-nav a.active{background:var(--ink);color:#fff;border-color:var(--ink)}

</style>
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text"><span class="brand-name">KashRun</span><span class="brand-tagline">Everything Kashmir Needs</span></div>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">♡<span class="icon-badge" data-wishlist-count style="display:none">0</span></a>
      <a class="icon-btn" href="cart.html" aria-label="Cart">🛍<span class="icon-badge" data-cart-count style="display:none">0</span></a>
      <a class="icon-btn" href="login.html" data-account-link aria-label="Account"><span data-account-label>👤</span></a>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 class="page-title" style="font-size:1.8rem">Your Cart</h1>
    <div id="cart-root"><div class="spinner"></div></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div><div class="footer-brand">KashRun</div><p class="footer-tag">Everything Kashmir Needs</p></div>
    <div class="footer-col"><h4>Customer Service</h4><ul><li><a href="#">About KashRun</a></li><li><a href="#">Contact</a></li></ul></div>
    <div class="footer-col"><h4>Policies</h4><ul><li><a href="#">Privacy Policy</a></li><li><a href="#">Terms &amp; Conditions</a></li></ul></div>
    <div class="footer-col"><h4>Delivery</h4><ul><li><a href="#">Shipping Policy</a></li><li><a href="#">Return Policy</a></li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 KashRun. Serving Jammu &amp; Kashmir.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script>
  const DELIVERY_CHARGE = 40;

  async function render() {
    const root = document.getElementById("cart-root");
    const items = await krCartFetchDetailed();
    const valid = items.filter(i => i.product && i.product.is_active !== false);

    if (valid.length === 0) {
      root.innerHTML = `
        <div class="empty-state">
          <h3>Your cart is empty</h3>
          <p>Add something you love from our catalogue.</p>
          <a href="products.html" class="btn btn-primary" style="margin-top:16px">Browse Products</a>
        </div>`;
      return;
    }

    const subtotal = valid.reduce((sum, i) => sum + (i.product.price * i.quantity), 0);
    const total = subtotal + DELIVERY_CHARGE;

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          ${valid.map(i => {
            const img = krPrimaryImage(i.product);
            const key = i.id || i.product_id;
            const isRow = !!i.id;
            return `
            <div class="cart-item" data-key="${key}" data-isrow="${isRow}">
              <img src="${img}" alt="${i.product.name}" onerror="this.src='assets/logo.png'">
              <div class="cart-item-body">
                <a href="product.html?id=${i.product_id}" style="font-weight:600">${i.product.name}</a>
                <span style="font-family:var(--font-mono);font-weight:600">${krFormatPrice(i.product.price)}</span>
                <div style="display:flex;align-items:center;gap:16px">
                  <div class="qty-control">
                    <button class="qty-dec">−</button>
                    <span>${i.quantity}</span>
                    <button class="qty-inc">+</button>
                  </div>
                  <button class="btn-ghost remove-btn" style="color:var(--danger);font-size:.82rem;font-weight:600">Remove</button>
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>
        <div class="summary-card">
          <h3 style="margin-bottom:14px">Order Summary</h3>
          <div class="summary-row"><span>Subtotal</span><span>${krFormatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${krFormatPrice(DELIVERY_CHARGE)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${krFormatPrice(total)}</span></div>
          <a href="checkout.html" class="btn btn-accent btn-block" style="margin-top:16px">Proceed to Checkout</a>
        </div>
      </div>
    `;

    root.querySelectorAll(".cart-item").forEach(el => {
      const key = el.getAttribute("data-key");
      const isRow = el.getAttribute("data-isrow") === "true";
      const qtySpan = el.querySelector(".qty-control span");
      let currentQty = parseInt(qtySpan.textContent, 10);

      el.querySelector(".qty-inc").addEventListener("click", async () => {
        currentQty += 1;
        await krCartSetQty(key, currentQty, isRow);
        render();
      });
      el.querySelector(".qty-dec").addEventListener("click", async () => {
        currentQty -= 1;
        await krCartSetQty(key, currentQty, isRow);
        render();
      });
      el.querySelector(".remove-btn").addEventListener("click", async () => {
        await krCartRemove(key, isRow);
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
