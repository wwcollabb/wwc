<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — KashRun</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <span class="brand-name">KashRun</span>
        <span class="brand-tagline">Everything Kashmir Needs</span>
      </div>
    </a>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="form-card">
      <h1>Create your account</h1>
      <p class="form-sub">Shop KashRun and track your orders in one place.</p>
      <div class="form-error" id="signup-error"></div>
      <form id="signup-form">
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create Account</button>
      </form>
      <p class="form-note">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script>
  const form = document.getElementById("signup-form");
  const errorBox = document.getElementById("signup-error");
  const btn = document.getElementById("signup-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    if (password !== confirm) {
      errorBox.textContent = "Passwords do not match.";
      errorBox.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creating account…";
    try {
      const { user } = await krSignUp({
        fullName: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        password,
      });
      if (user) await krCartMergeOnLogin(user.id);
      krPostLoginRedirect();
    } catch (err) {
      errorBox.textContent = krFriendlyError(err);
      errorBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  });
</script>
</body>
</html>
