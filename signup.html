<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WinKom - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0f; font-family: 'Segoe UI', sans-serif; }
        .glow-card { box-shadow: 0 0 40px rgba(34, 211, 238, 0.15), 0 0 80px rgba(34, 211, 238, 0.05); }
        .glow-btn { box-shadow: 0 0 25px rgba(34, 211, 238, 0.4); transition: all 0.3s; }
        .glow-btn:hover { box-shadow: 0 0 45px rgba(34, 211, 238, 0.7); transform: translateY(-2px); }
        .glow-input:focus { box-shadow: 0 0 20px rgba(34, 211, 238, 0.3); border-color: #22d3ee; }
        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-in">
        <div class="bg-[#12121a] rounded-2xl p-8 glow-card border border-cyan-500/20">
            <div class="text-center mb-8">
                <img src="logo.png" alt="WinKom Logo" class="mx-auto mb-4 w-20 h-20 rounded-xl" onerror="this.style.display='none'"/>
                <h1 class="text-3xl font-bold text-white">Win<span class="text-cyan-400">Kom</span></h1>
                <p class="text-gray-400 mt-2 text-sm">Create Your Account</p>
                <p class="text-cyan-400 mt-2 text-xs bg-cyan-500/10 rounded-full px-4 py-1 inline-block">💎 Exclusive Bonus Waiting!</p>
            </div>

            <div id="errorMsg" class="hidden bg-red-500/20 border border-red-500/50 text-red-300 p-3 rounded-lg mb-4 text-sm"></div>
            <div id="successMsg" class="hidden bg-green-500/20 border border-green-500/50 text-green-300 p-3 rounded-lg mb-4 text-sm"></div>

            <form id="signupForm" class="space-y-4">
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter your full name" autocomplete="name"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Phone Number</label>
                    <div class="flex gap-2">
                        <div class="bg-[#1a1a28] border border-gray-700 rounded-lg px-3 py-3 flex items-center gap-1 text-white">
                            <span class="text-lg">🇮🇳</span>
                            <span class="text-sm">+91</span>
                        </div>
                        <input type="tel" id="phoneNumber" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number"
                            class="glow-input flex-1 bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                    </div>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="Min 6 characters" autocomplete="new-password"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Withdrawal Code <span class="text-gray-500 text-xs font-normal">(4-digit)</span></label>
                    <input type="text" id="withdrawalCode" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric" placeholder="Set 4-digit code"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"/>
                    <p class="text-gray-500 text-xs mt-1">🔒 You'll need this code for withdrawals</p>
                </div>
                <div>
                    <label class="text-gray-300 text-sm font-medium mb-1 block">Referral Code <span class="text-gray-500 text-xs font-normal">(Optional)</span></label>
                    <input type="text" id="referralCodeInput" placeholder="Enter referral code if you have one"
                        class="glow-input w-full bg-[#1a1a28] border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition uppercase"/>
                    <p class="text-gray-500 text-xs mt-1">💡 If someone referred you, enter their code to get ₹59 bonus</p>
                </div>

                <button type="submit" id="signupBtn"
                    class="glow-btn w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3 px-4 rounded-lg text-lg">
                    Sign Up & Claim Your Exclusive Bonus
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-gray-700"></div>
                <span class="px-4 text-gray-400 text-sm">or</span>
                <div class="flex-1 h-px bg-gray-700"></div>
            </div>

            <button id="googleBtn"
                class="w-full bg-white text-gray-800 font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign Up with Google
            </button>

            <p class="text-center mt-6 text-gray-400 text-sm">
                Already have an account?
                <a href="login.html" class="text-cyan-400 hover:text-cyan-300 font-semibold">Login</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY",
            authDomain: "winkom-da4c2.firebaseapp.com",
            projectId: "winkom-da4c2",
            storageBucket: "winkom-da4c2.firebasestorage.app",
            messagingSenderId: "629229462242",
            appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }
        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
        }
        function hideMessages() {
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlRef = urlParams.get('ref');
        if (urlRef) {
            document.getElementById('referralCodeInput').value = urlRef.toUpperCase();
        }

        function generateReferralCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'WK';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function findReferrerByCode(refCode) {
            if (!refCode || refCode.trim() === '') return null;
            const trimmed = refCode.trim().toUpperCase();
            const q1 = query(collection(db, 'users'), where('referralCode', '==', trimmed));
            const snap1 = await getDocs(q1);
            if (!snap1.empty) {
                const doc = snap1.docs[0];
                return { uid: doc.id, data: doc.data() };
            }
            const q2 = query(collection(db, 'users'), where('uid', '==', trimmed));
            const snap2 = await getDocs(q2);
            if (!snap2.empty) {
                const doc = snap2.docs[0];
                return { uid: doc.id, data: doc.data() };
            }
            return null;
        }

        async function processReferralBonus(newUserId, newUserName, referrerUid, referrerData) {
            try {
                const referrerRef = doc(db, 'users', referrerUid);
                const referrerSnap = await getDoc(referrerRef);
                if (referrerSnap.exists()) {
                    const currentData = referrerSnap.data();
                    const newBalance = (currentData.balance || 0) + 79;
                    const newRefEarnings = (currentData.totalReferralEarnings || 0) + 79;
                    const newRefCount = (currentData.referralCount || 0) + 1;
                    await updateDoc(referrerRef, {
                        balance: newBalance,
                        totalReferralEarnings: newRefEarnings,
                        referralCount: newRefCount
                    });
                    await addDoc(collection(db, 'transactions'), {
                        uid: referrerUid,
                        type: 'referral_bonus',
                        description: 'Referral Bonus (Friend Joined)',
                        amount: 79,
                        balanceAfter: newBalance,
                        createdAt: serverTimestamp()
                    });
                    await addDoc(collection(db, 'referrals'), {
                        referrerUid: referrerUid,
                        referrerName: currentData.name || 'Unknown',
                        referrerCode: currentData.referralCode || 'N/A',
                        referredUserId: newUserId,
                        referredUserName: newUserName,
                        bonusAmount: 79,
                        referredUserBonus: 59,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (err) {
                console.error('Referral bonus error:', err);
            }
        }

        async function handleSignup(user, name, phone, withdrawalCode, refCode) {
            const userRef = doc(db, 'users', user.uid);
            const existingSnap = await getDoc(userRef);
            if (existingSnap.exists()) {
                window.location.href = 'index.html';
                return;
            }
            let referrerInfo = null;
            if (refCode && refCode.trim() !== '') {
                referrerInfo = await findReferrerByCode(refCode);
            }
            const initialBalance = 59;
            const newUserData = {
                uid: user.uid,
                name: name,
                email: user.email,
                phone: phone,
                balance: initialBalance,
                totalEarnings: 0,
                totalReferralEarnings: 0,
                referralCode: generateReferralCode(),
                referredBy: referrerInfo ? referrerInfo.uid : null,
                referralCount: 0,
                withdrawalCode: withdrawalCode || '',
                status: 'active',
                createdAt: serverTimestamp()
            };
            await setDoc(userRef, newUserData);
            await addDoc(collection(db, 'transactions'), {
                uid: user.uid,
                type: 'signup_bonus',
                description: 'Signup Bonus',
                amount: 59,
                balanceAfter: initialBalance,
                createdAt: serverTimestamp()
            });
            if (referrerInfo) {
                await processReferralBonus(user.uid, name, referrerInfo.uid, referrerInfo.data);
                return 'referral_success';
            } else if (refCode && refCode.trim() !== '') {
                return 'referral_not_found';
            } else {
                return 'no_referral';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const password = document.getElementById('password').value;
            const withdrawalCode = document.getElementById('withdrawalCode').value.trim();
            const refCode = document.getElementById('referralCodeInput').value.trim();

            if (!/^[0-9]{10}$/.test(phone)) {
                showError('Please enter a valid 10-digit phone number.');
                return;
            }
            if (!/^[0-9]{4}$/.test(withdrawalCode)) {
                showError('Withdrawal code must be exactly 4 digits.');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const result = await handleSignup(userCredential.user, name, phone, withdrawalCode, refCode);
                
                if (result === 'referral_success') {
                    showSuccess('🎉 Account created with referral! ₹59 bonus credited to your wallet!');
                } else if (result === 'referral_not_found') {
                    showSuccess('⚠️ Account created but referral code not found. ₹59 bonus credited!');
                } else {
                    showSuccess('🎉 Account created! ₹59 bonus credited to your wallet!');
                }

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Sign Up & Claim Your Exclusive Bonus';
                if (err.code === 'auth/email-already-in-use') {
                    showError('This email is already registered. Please login instead.');
                } else if (err.code === 'auth/weak-password') {
                    showError('Password should be at least 6 characters.');
                } else if (err.code === 'auth/invalid-email') {
                    showError('Please enter a valid email address.');
                } else {
                    showError(err.message);
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            hideMessages();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const signupResult = await handleSignup(user, user.displayName || 'User', '', '', document.getElementById('referralCodeInput').value.trim());
                
                if (signupResult === 'referral_success') {
                    alert('🎉 Account created with referral! ₹59 bonus credited!');
                } else if (signupResult === 'referral_not_found') {
                    alert('⚠️ Account created but referral code not found. ₹59 bonus credited!');
                } else {
                    alert('🎉 Google Sign Up successful! ₹59 bonus credited!');
                }
                
                window.location.href = 'index.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(err.message);
                }
            }
        });
    </script>
</body>
</html>
