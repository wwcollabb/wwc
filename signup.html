<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinKom — Sign Up & Claim Bonus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#111118; --border:#1e1e2e; --accent:#00d4ff; --accent2:#7c3aed; --text:#e2e8f0; --muted:#94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .signup-card { background: var(--card); border:1px solid var(--border); border-radius:1.5rem; padding:2.5rem; width:100%; max-width:460px; position:relative; z-index:10; box-shadow:0 0 60px rgba(0,212,255,0.05),0 25px 60px rgba(0,0,0,0.5); }
        .logo-container { display:flex; align-items:center; justify-content:center; gap:.75rem; margin-bottom:2rem; }
        .logo-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.4rem; color:#fff; }
        .logo-text { font-size:1.8rem; font-weight:900; background:linear-gradient(135deg,#fff,#94a3b8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .input-field { background:#0d0d14; border:1px solid var(--border); border-radius:.75rem; padding:.85rem 1.2rem; width:100%; color:var(--text); font-size:.95rem; outline:none; }
        .input-field:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,212,255,.15); }
        .btn-primary { background:linear-gradient(135deg,#00d4ff,#7c3aed); border:none; border-radius:.75rem; padding:1rem; width:100%; color:#fff; font-weight:700; font-size:1.05rem; cursor:pointer; transition:all .3s; box-shadow:0 0 30px rgba(0,212,255,.3); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 50px rgba(0,212,255,.5); }
        .btn-google { background:#1a1a2e; border:1px solid var(--border); border-radius:.75rem; padding:.85rem; width:100%; color:var(--text); font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.75rem; }
        .btn-google:hover { border-color:var(--accent); background:#1e1e32; }
        .divider { display:flex; align-items:center; gap:1rem; margin:1.5rem 0; color:#444; font-size:.85rem; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
        .error-msg { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:.75rem; padding:.75rem 1rem; color:#fca5a5; font-size:.85rem; margin-bottom:1rem; display:none; }
        .success-msg { background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3); border-radius:.75rem; padding:.75rem 1rem; color:#6ee7b7; font-size:.85rem; margin-bottom:1rem; display:none; }
        .toggle-password { background:none; border:none; color:#666; cursor:pointer; font-size:1.1rem; position:absolute; right:1rem; top:50%; transform:translateY(-50%); }
        .relative-wrap { position:relative; }
        .bonus-highlight { background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15)); border:2px solid rgba(0,212,255,.4); border-radius:1rem; padding:1.2rem 1.5rem; margin-bottom:1.5rem; text-align:center; }
        .bonus-highlight h3 { font-size:1.15rem; font-weight:700; color:var(--accent); }
        .bonus-highlight .rupee { font-size:2rem; font-weight:900; background:linear-gradient(135deg,#00d4ff,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .login-link { text-align:center; margin-top:1.5rem; color:var(--muted); font-size:.9rem; }
        .login-link a { color:var(--accent); text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="logo-container">
            <div class="logo-icon">W</div>
            <span class="logo-text">WinKom</span>
        </div>
        <div class="bonus-highlight">
            <h3>🎉 Exclusive Signup Bonus</h3>
            <p>Your referrer earns</p>
            <div class="rupee">₹79</div>
            <p style="margin-top:.3rem; font-size:.75rem;">You also unlock premium investment plans</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <form id="signupForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Full Name</label>
                <input type="text" id="fullName" class="input-field" placeholder="Enter your full name" required autocomplete="name" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Email Address</label>
                <input type="email" id="email" class="input-field" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Password</label>
                <div class="relative-wrap">
                    <input type="password" id="password" class="input-field" placeholder="Create a strong password" required minlength="6" autocomplete="new-password" style="padding-right:3rem;" />
                    <button type="button" class="toggle-password" id="togglePassword">👁️</button>
                </div>
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-400 mb-1.5">Referral Code <span class="text-xs text-gray-600">(optional)</span></label>
                <input type="text" id="referralCode" class="input-field" placeholder="Enter referral code if you have one" />
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">🚀 Sign Up & Claim Your Exclusive Bonus</button>
        </form>
        <div class="divider">OR</div>
        <button class="btn-google" id="googleSignupBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21.35 11.1H12v2.9h5.35c-.5 2.5-2.6 4.3-5.35 4.3a5.5 5.5 0 0 1 0-11c1.4 0 2.7.5 3.7 1.4l2.1-2.1A8.5 8.5 0 0 0 12 3.5a8.5 8.5 0 0 0 0 17c4.9 0 8.2-3.4 8.2-8.2 0-.5-.1-1-.15-1.2z" fill="#4285F4"/><path d="M5.5 14.5a5.5 5.5 0 0 1 0-5l2.2 1.7a3 3 0 0 0 0 1.6l-2.2 1.7z" fill="#34A853"/><path d="M12 17.5a5.5 5.5 0 0 0 5-3.2l-2.2-1.7a3 3 0 0 1-2.8 1.9 3 3 0 0 1-2.8-1.9l-2.2 1.7a5.5 5.5 0 0 0 5 3.2z" fill="#FBBC05"/></svg>
            Sign up with Google
        </button>
        <div class="login-link">Already have an account? <a href="login.html">Log In</a></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY", authDomain: "winkom-da4c2.firebaseapp.com", projectId: "winkom-da4c2", storageBucket: "winkom-da4c2.firebasestorage.app", messagingSenderId: "629229462242", appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const signupForm = document.getElementById('signupForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const referralCodeInput = document.getElementById('referralCode');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const signupBtn = document.getElementById('signupBtn');
        const googleSignupBtn = document.getElementById('googleSignupBtn');
        const togglePasswordBtn = document.getElementById('togglePassword');

        // Auto-detect referral from URL if present
        const urlParams = new URLSearchParams(window.location.search);
        const refFromUrl = urlParams.get('ref');
        if (refFromUrl) {
            referralCodeInput.value = refFromUrl;
            referralCodeInput.readOnly = true;
            referralCodeInput.style.backgroundColor = '#0a0a10';
            referralCodeInput.style.cursor = 'not-allowed';
            referralCodeInput.title = 'Referral code from your invite link';
        }

        function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; successMsg.style.display = 'none'; setTimeout(() => errorMsg.style.display = 'none', 5000); }
        function showSuccess(msg) { successMsg.textContent = msg; successMsg.style.display = 'block'; errorMsg.style.display = 'none'; setTimeout(() => successMsg.style.display = 'none', 5000); }
        function generateReferralCode() { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let code = 'WIN'; for (let i=0;i<5;i++) code += chars.charAt(Math.floor(Math.random()*chars.length)); return code; }
        function isValidEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }

        async function awardReferralBonus(referrerUid) {
            try {
                const referrerRef = doc(db, 'users', referrerUid);
                const referrerSnap = await getDoc(referrerRef);
                if (referrerSnap.exists()) {
                    const data = referrerSnap.data();
                    await updateDoc(referrerRef, { balance: (data.balance || 0) + 79, referralEarnings: (data.referralEarnings || 0) + 79 });
                    await addDoc(collection(db, 'referralBonuses'), { referrerUid, newUserEmail: emailInput.value.trim(), amount: 79, createdAt: serverTimestamp(), type: 'referral_bonus' });
                    return true;
                } return false;
            } catch (e) { console.error(e); return false; }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = fullNameInput.value.trim();
            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const referralCode = referralCodeInput.value.trim();

            if (!name || name.length < 2) { showError('Please enter your full name.'); return; }
            if (!isValidEmail(email)) { showError('Invalid email.'); return; }
            if (!password || password.length < 6) { showError('Password must be at least 6 characters.'); return; }

            signupBtn.disabled = true; signupBtn.textContent = '⏳ Creating...';
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const newReferralCode = generateReferralCode();
                const userData = {
                    uid: user.uid, name, email, balance:0, totalInvested:0, totalEarned:0,
                    referralEarnings:0, referralCode:newReferralCode,
                    referredBy: referralCode || null,
                    status:'active', role:'user',
                    createdAt: serverTimestamp(), lastLogin: serverTimestamp()
                };
                await setDoc(doc(db, 'users', user.uid), userData);
                if (referralCode) await awardReferralBonus(referralCode);
                showSuccess('✅ Account created! Redirecting...');
                signupBtn.textContent = '✅ Account Created!';
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                let friendlyMsg = 'Signup failed.';
                if (error.code === 'auth/email-already-in-use') friendlyMsg = 'Email already registered.';
                else if (error.code === 'auth/weak-password') friendlyMsg = 'Weak password.';
                showError(friendlyMsg);
                signupBtn.disabled = false; signupBtn.textContent = '🚀 Sign Up & Claim Your Exclusive Bonus';
            }
        }

        async function handleGoogleSignup() {
            googleSignupBtn.disabled = true; googleSignupBtn.innerHTML = '⏳ Connecting...';
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                const userRef = doc(db, 'users', user.uid);
                const userSnap = await getDoc(userRef);
                if (!userSnap.exists()) {
                    const newReferralCode = generateReferralCode();
                    const userData = {
                        uid: user.uid, name: user.displayName || 'Google User', email: user.email,
                        balance:0, totalInvested:0, totalEarned:0, referralEarnings:0,
                        referralCode:newReferralCode,
                        referredBy: referralCodeInput.value.trim() || null,
                        status:'active', role:'user',
                        createdAt: serverTimestamp(), lastLogin: serverTimestamp()
                    };
                    await setDoc(userRef, userData);
                    if (referralCodeInput.value.trim()) await awardReferralBonus(referralCodeInput.value.trim());
                } else {
                    await updateDoc(userRef, { lastLogin: serverTimestamp() });
                }
                showSuccess('✅ Signed in with Google! Redirecting...');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (error) {
                showError('Google sign-in failed.');
                googleSignupBtn.disabled = false; googleSignupBtn.innerHTML = 'Sign up with Google';
            }
        }

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') { passwordInput.type = 'text'; togglePasswordBtn.textContent = '🙈'; }
            else { passwordInput.type = 'password'; togglePasswordBtn.textContent = '👁️'; }
        });
        signupForm.addEventListener('submit', handleSignup);
        googleSignupBtn.addEventListener('click', handleGoogleSignup);
        onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'index.html'; });
    </script>
</body>
</html>
