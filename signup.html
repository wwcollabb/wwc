<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WinKom - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --cyan: #22d3ee;
            --cyan-soft: rgba(34, 211, 238, 0.35);
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background:
                radial-gradient(circle at 15% 10%, rgba(34, 211, 238, 0.10), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(99, 102, 241, 0.10), transparent 45%),
                #050508;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        h1, .display-font { font-family: 'Sora', sans-serif; }

        .glass-card {
            background: #101018;
            border: 1px solid rgba(34, 211, 238, 0.15);
            box-shadow: 0 0 40px rgba(34, 211, 238, 0.08), 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }
        .glow-btn:hover { box-shadow: 0 0 32px rgba(34, 211, 238, 0.5); transform: translateY(-1px); }
        .glow-btn:active { transform: translateY(0); }

        .field { position: relative; }
        .field input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .field input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12);
            background: rgba(255,255,255,0.05);
            outline: none;
        }
        .field label {
            position: absolute;
            left: 16px;
            top: 14px;
            font-size: 0.95rem;
            color: #6b7280;
            pointer-events: none;
            transition: all 0.18s ease;
            background: transparent;
            padding: 0 4px;
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: -9px;
            left: 12px;
            font-size: 0.72rem;
            color: var(--cyan);
            background: #100f18;
        }

        .fade-in { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        .logo-ring {
            position: relative;
            padding: 3px;
            border-radius: 18px;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
        }

        .phone-row { align-items: stretch; }
        .phone-badge, .phone-row input {
            height: 52px;
            box-sizing: border-box;
        }
        .phone-badge { display: flex; align-items: center; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-in relative z-10">
        <div class="glass-card rounded-2xl p-8">
            <div class="text-center mb-8">
                <div class="logo-ring inline-block mb-5">
                    <img src="logo.png" alt="WinKom Logo" class="block mx-auto w-16 h-16 rounded-2xl bg-[#0d0d14] object-cover" onerror="this.style.display='none'"/>
                </div>
                <h1 class="display-font text-3xl font-bold text-white tracking-tight">Win<span class="text-cyan-400">Kom</span></h1>
                <p class="text-gray-500 mt-2 text-sm">Create Your Account</p>
                <p class="text-cyan-400 mt-2 text-xs bg-cyan-500/10 rounded-full px-4 py-1 inline-block">💎 ₹21-99 Signup Bonus Waiting!</p>
            </div>

            <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/30 text-red-300 p-3 rounded-lg mb-4 text-sm"></div>
            <div id="successMsg" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 p-3 rounded-lg mb-4 text-sm"></div>

            <form id="signupForm" class="space-y-5">
                <div class="field">
                    <input type="text" id="fullName" required placeholder=" " autocomplete="name"
                        class="w-full rounded-lg px-4 py-3.5 text-white placeholder-transparent"/>
                    <label for="fullName">Full Name</label>
                </div>
                <div class="field">
                    <input type="email" id="email" required placeholder=" " autocomplete="email"
                        class="w-full rounded-lg px-4 py-3.5 text-white placeholder-transparent"/>
                    <label for="email">Email Address</label>
                </div>
                <div>
                    <label class="text-gray-400 text-sm font-medium mb-1.5 block">Phone Number</label>
                    <div class="flex gap-2 phone-row">
                        <div class="phone-badge shrink-0 bg-[rgba(255,255,255,0.03)] border border-white/10 rounded-lg px-3 gap-1 text-white">
                            <span class="text-lg leading-none">🇮🇳</span>
                            <span class="text-sm leading-none">+91</span>
                        </div>
                        <input type="tel" id="phoneNumber" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number"
                            class="flex-1 w-full rounded-lg pl-4 pr-3 text-white placeholder-gray-500 bg-[rgba(255,255,255,0.03)] border border-white/10 focus:border-cyan-400 focus:shadow-[0_0_0_3px_rgba(34,211,238,0.12)] focus:outline-none transition"/>
                    </div>
                </div>
                <div>
                    <div class="field relative">
                        <input type="password" id="password" required minlength="6" placeholder=" " autocomplete="new-password"
                            class="w-full rounded-lg px-4 py-3.5 pr-11 text-white placeholder-transparent"/>
                        <label for="password">Password</label>
                        <button type="button" id="togglePassword" tabindex="-1"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-cyan-400 transition">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>
                    <p class="text-gray-500 text-xs mt-1.5 ml-1">Min 6 characters</p>
                </div>
                <div>
                    <div class="field">
                        <input type="text" id="withdrawalCode" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric" placeholder=" "
                            class="w-full rounded-lg px-4 py-3.5 text-white placeholder-transparent"/>
                        <label for="withdrawalCode">Withdrawal Code (4-digit)</label>
                    </div>
                    <p class="text-gray-500 text-xs mt-1.5 ml-1">🔒 You'll need this code for withdrawals</p>
                </div>
                <div>
                    <div class="field">
                        <input type="text" id="referralCodeInput" placeholder=" "
                            class="w-full rounded-lg px-4 py-3.5 text-white placeholder-transparent uppercase"/>
                        <label for="referralCodeInput">Referral Code (Optional)</label>
                    </div>
                    <p class="text-gray-500 text-xs mt-1.5 ml-1">💡 If someone referred you, enter their code to get ₹21 bonus</p>
                </div>

                <button type="submit" id="signupBtn"
                    class="glow-btn w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-semibold py-3.5 px-4 rounded-lg">
                    Sign Up &amp; Claim Your Exclusive Bonus
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-1 h-px bg-gray-800"></div>
                <span class="px-4 text-gray-500 text-xs">or</span>
                <div class="flex-1 h-px bg-gray-800"></div>
            </div>

            <button id="googleBtn"
                class="w-full bg-white text-gray-800 font-medium py-3.5 px-4 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign Up with Google
            </button>

            <p class="text-center mt-6 text-gray-500 text-sm">
                Already have an account?
                <a href="login.html" class="text-cyan-400 hover:text-cyan-300 font-semibold">Login</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFfM5dHaVdt8q0bhGnswFYfeeYzyJ61GY",
            authDomain: "winkom-da4c2.firebaseapp.com",
            projectId: "winkom-da4c2",
            storageBucket: "winkom-da4c2.firebasestorage.app",
            messagingSenderId: "629229462242",
            appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        /* ============================================================
           REFERRAL BONUS AMOUNTS (single source of truth)
           Referrer earns ₹39 · New referred user receives ₹21
           ============================================================ */
        const REFERRER_BONUS = 39;
        const REFERRED_USER_BONUS = 21;

        document.getElementById('togglePassword').addEventListener('click', () => {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const isHidden = pwd.type === 'password';
            pwd.type = isHidden ? 'text' : 'password';
            icon.innerHTML = isHidden
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M9.363 5.365A9.466 9.466 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-2.293 3.95M6.228 6.228A10.05 10.05 0 002.458 12c1.274 4.057 5.064 7 9.542 7a9.47 9.47 0 004.635-1.192"/>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }
        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
        }
        function hideMessages() {
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const urlRef = urlParams.get('ref');
        if (urlRef) {
            document.getElementById('referralCodeInput').value = urlRef.toUpperCase();
        }

        function generateReferralCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'WK';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function findReferrerByCode(refCode) {
            if (!refCode || refCode.trim() === '') return null;
            const trimmed = refCode.trim().toUpperCase();
            const q1 = query(collection(db, 'users'), where('referralCode', '==', trimmed));
            const snap1 = await getDocs(q1);
            if (!snap1.empty) {
                const d = snap1.docs[0];
                return { uid: d.id, data: d.data() };
            }
            const q2 = query(collection(db, 'users'), where('uid', '==', trimmed));
            const snap2 = await getDocs(q2);
            if (!snap2.empty) {
                const d = snap2.docs[0];
                return { uid: d.id, data: d.data() };
            }
            return null;
        }

        /**
         * Credits the referrer ₹39 and writes a single referral record.
         * Guarded against duplicate credits for the same referred user.
         */
        async function processReferralBonus(newUserId, newUserName, referrerUid, referrerData) {
            try {
                // Duplicate guard: never create a second referral record/credit for the same new user.
                const dupSnap = await getDocs(query(
                    collection(db, 'referrals'),
                    where('referredUserId', '==', newUserId)
                ));
                if (!dupSnap.empty) return;

                const referrerRef = doc(db, 'users', referrerUid);
                const referrerSnap = await getDoc(referrerRef);
                if (!referrerSnap.exists()) return;

                const currentData = referrerSnap.data();
                const newBalance = (currentData.balance || 0) + REFERRER_BONUS;
                const newRefEarnings = (currentData.totalReferralEarnings || 0) + REFERRER_BONUS;
                const newRefCount = (currentData.referralCount || 0) + 1;

                await updateDoc(referrerRef, {
                    balance: newBalance,
                    totalReferralEarnings: newRefEarnings,
                    referralCount: newRefCount
                });

                await addDoc(collection(db, 'transactions'), {
                    uid: referrerUid,
                    type: 'referral_bonus',
                    description: 'Referral Bonus (Friend Joined)',
                    amount: REFERRER_BONUS,
                    balanceAfter: newBalance,
                    createdAt: serverTimestamp()
                });

                await addDoc(collection(db, 'referrals'), {
                    referrerUid: referrerUid,
                    referrerName: currentData.name || 'Unknown',
                    referrerCode: currentData.referralCode || 'N/A',
                    referredUserId: newUserId,
                    referredUserName: newUserName,
                    bonusAmount: REFERRER_BONUS,
                    referredUserBonus: REFERRED_USER_BONUS,
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error('Referral bonus error:', err);
            }
        }

        async function handleSignup(user, name, phone, withdrawalCode, refCode) {
            const userRef = doc(db, 'users', user.uid);
            const existingSnap = await getDoc(userRef);
            if (existingSnap.exists()) {
                // Existing user — never re-credit any bonus
                window.location.href = 'index.html';
                return 'existing';
            }

            let referrerInfo = null;
            if (refCode && refCode.trim() !== '') {
                referrerInfo = await findReferrerByCode(refCode);
            }

            // ₹21 signup bonus for the new user (whether referred or not)
            const initialBalance = REFERRED_USER_BONUS;

            const newUserData = {
                uid: user.uid,
                name: name,
                email: user.email,
                phone: phone,
                balance: initialBalance,
                totalEarnings: 0,
                totalReferralEarnings: 0,
                referralCode: generateReferralCode(),
                referredBy: referrerInfo ? referrerInfo.uid : null,
                referralCount: 0,
                withdrawalCode: withdrawalCode || '',
                status: 'active',
                createdAt: serverTimestamp()
            };
            await setDoc(userRef, newUserData);

            await addDoc(collection(db, 'transactions'), {
                uid: user.uid,
                type: 'signup_bonus',
                description: referrerInfo ? 'Signup Bonus (Referred)' : 'Signup Bonus',
                amount: initialBalance,
                balanceAfter: initialBalance,
                createdAt: serverTimestamp()
            });

            if (referrerInfo) {
                await processReferralBonus(user.uid, name, referrerInfo.uid, referrerInfo.data);
                return 'referral_success';
            } else if (refCode && refCode.trim() !== '') {
                return 'referral_not_found';
            } else {
                return 'no_referral';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phoneNumber').value.trim();
            const password = document.getElementById('password').value;
            const withdrawalCode = document.getElementById('withdrawalCode').value.trim();
            const refCode = document.getElementById('referralCodeInput').value.trim();

            if (!/^[0-9]{10}$/.test(phone)) {
                showError('Please enter a valid 10-digit phone number.');
                return;
            }
            if (!/^[0-9]{4}$/.test(withdrawalCode)) {
                showError('Withdrawal code must be exactly 4 digits.');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const result = await handleSignup(userCredential.user, name, phone, withdrawalCode, refCode);

                if (result === 'referral_success') {
                    showSuccess('🎉 Account created! ₹21 credited to your wallet. Your referrer earned ₹39!');
                } else if (result === 'referral_not_found') {
                    showSuccess('⚠️ Account created, but that referral code was not found. ₹21 signup bonus credited to your wallet!');
                } else {
                    showSuccess('🎉 Account created! ₹21 signup bonus credited to your wallet!');
                }

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1600);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Sign Up & Claim Your Exclusive Bonus';
                if (err.code === 'auth/email-already-in-use') {
                    showError('This email is already registered. Please login instead.');
                } else if (err.code === 'auth/weak-password') {
                    showError('Password should be at least 6 characters.');
                } else if (err.code === 'auth/invalid-email') {
                    showError('Please enter a valid email address.');
                } else {
                    showError(err.message);
                }
            }
        });

        document.getElementById('googleBtn').addEventListener('click', async () => {
            hideMessages();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const signupResult = await handleSignup(
                    user,
                    user.displayName || 'User',
                    '',
                    '',
                    document.getElementById('referralCodeInput').value.trim()
                );

                if (signupResult === 'referral_success') {
                    alert('🎉 Account created! ₹21 credited to your wallet. Your referrer earned ₹39!');
                } else if (signupResult === 'referral_not_found') {
                    alert('⚠️ Account created, but that referral code was not found. ₹21 signup bonus credited!');
                } else if (signupResult === 'existing') {
                    // redirect already triggered inside handleSignup
                } else {
                    alert('🎉 Google Sign Up successful! ₹21 signup bonus credited!');
                }

                window.location.href = 'index.html';
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(err.message);
                }
            }
        });
    </script>
</body>
</html>
