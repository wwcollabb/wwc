<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WinKom — Support</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#070b14;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.13);
  --text:#eef4fb;
  --muted:#8b98ad;
  --dim:#5b6879;
  --cyan:#22d3ee;
  --cyan-soft:#67e8f9;
  --amber:#f59e0b;
  --emerald:#10b981;
  --violet:#8b5cf6;
  --rose:#f43f5e;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  color:var(--text);
  font-family:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-color:var(--bg);
  background-image:
    radial-gradient(680px 420px at 8% -12%, rgba(34,211,238,.10), transparent 62%),
    radial-gradient(620px 420px at 102% 2%, rgba(99,102,241,.09), transparent 60%),
    radial-gradient(700px 520px at 50% 112%, rgba(16,185,129,.05), transparent 62%);
  background-attachment:fixed;
}
::selection{background:rgba(34,211,238,.3)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(34,211,238,.35)}

.ic{width:20px;height:20px;flex:none;display:block;stroke:currentColor;fill:none;
    stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.ic-xs{width:13px;height:13px;stroke-width:2.2}

/* Sidebar */
.sidebar{transition:transform .32s cubic-bezier(.4,0,.2,1)}
.sidebar-closed{transform:translateX(-100%)}
.sidebar-open{transform:translateX(0)}
@media (min-width:768px){.sidebar-closed{transform:translateX(0)}}

.nav-link{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:14px;font-size:14px;font-weight:600;
  color:var(--muted);border:1px solid transparent;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.nav-link:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-link.active{
  background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(34,211,238,.04));
  border-color:rgba(34,211,238,.22);
  color:var(--cyan-soft);
}
.nav-link .ic{width:18px;height:18px}

/* Brand */
.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none}
.brand-mark{
  width:40px;height:40px;flex:none;border-radius:12px;overflow:hidden;
  box-shadow:0 6px 18px rgba(34,211,238,.18);position:relative;
  background:linear-gradient(135deg,#22d3ee,#6366f1);
}
.brand-mark > *{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.brand-mark .is-hidden{display:none!important}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1;white-space:nowrap}
.brand-name .accent{
  background:linear-gradient(135deg,#22d3ee,#a78bfa);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* ============ FULL SCREEN WRAPPER ============ */
.page-wrap{
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.page-main{
  flex:1;
  min-height:0;
  display:flex;
  padding:0;
}
@media (min-width:640px){
  .page-main{padding:10px 12px 12px;}
}

/* ============ CHAT SHELL ============ */
.chat-shell{
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--line);
  border-radius:0;
  overflow:hidden;
  width:100%;
  max-width:960px;
  margin:0 auto;
  flex:1;
  min-height:0;
  position:relative;
  box-shadow:0 20px 55px rgba(0,0,0,.40);
}
@media (min-width:640px){
  .chat-shell{border-radius:20px;}
}

/* ============ FIXED HEADER (sticky at very top) ============ */
.chat-header{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  background:rgba(9,13,22,.92);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  flex:none;
  overflow:visible;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.chat-header::before{
  content:'';position:absolute;top:-60%;right:-8%;
  width:220px;height:220px;border-radius:999px;
  background:radial-gradient(circle, rgba(34,211,238,.16), transparent 70%);
  pointer-events:none;
}
.chat-header-avatar{
  width:44px;height:44px;border-radius:999px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(99,102,241,.18));
  border:1px solid rgba(34,211,238,.30);
  color:var(--cyan-soft);
  position:relative;
  box-shadow:0 0 22px rgba(34,211,238,.20);
  font-size:13px;font-weight:800;
  letter-spacing:.02em;
  transition:background .3s ease;
  z-index:1;
}
.chat-header-avatar::after{
  content:'';position:absolute;bottom:1px;right:1px;
  width:12px;height:12px;border-radius:999px;
  background:#10b981;border:2.5px solid #0a0f1a;
  box-shadow:0 0 8px rgba(16,185,129,.8);
  animation:pulse 1.8s ease-in-out infinite;
}
.chat-header-info{flex:1;min-width:0;position:relative;z-index:1}
.chat-header-title{font-size:14.5px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:-.01em;
  transition:color .25s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-header-sub{
  font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-header-sub .dot{
  width:6px;height:6px;border-radius:99px;background:#34d399;display:inline-block;
  animation:pulse 1.8s ease-in-out infinite;flex:none;
}
.chat-header-sub .agent-name{
  color:#a5f3fc;font-weight:800;
  background:linear-gradient(135deg,#a5f3fc,#c4b5fd);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:nameFadeIn .5s ease;
}
@keyframes nameFadeIn{
  from{opacity:0;transform:translateY(-2px)}
  to{opacity:1;transform:translateY(0)}
}

/* Mobile menu button inside header */
.header-menu-btn{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);
  color:#cbd5e1;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
  z-index:1;
}
.header-menu-btn:hover{background:rgba(255,255,255,.08);color:#fff}
@media (min-width:768px){
  .header-menu-btn{display:none}
}

/* ============ ESTIMATE CIRCLE ============ */
.estimate-wrap{position:relative;flex:none;z-index:1}
.estimate-circle{
  width:46px;height:46px;border-radius:999px;
  background:radial-gradient(circle at 30% 25%, rgba(34,211,238,.18), rgba(34,211,238,.04));
  border:1px solid rgba(34,211,238,.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;padding:0;
  color:var(--cyan-soft);
  transition:transform .2s ease, box-shadow .25s ease, border-color .2s ease;
  box-shadow:0 0 0 0 rgba(34,211,238,.25), 0 6px 20px rgba(34,211,238,.18);
  animation:circlePop .5s cubic-bezier(.16,1,.3,1);
}
@keyframes circlePop{
  0%{opacity:0;transform:scale(.6)}
  100%{opacity:1;transform:scale(1)}
}
.estimate-circle:hover{
  transform:translateY(-1px);
  border-color:rgba(34,211,238,.55);
  box-shadow:0 0 0 4px rgba(34,211,238,.10), 0 8px 24px rgba(34,211,238,.30);
}
.estimate-circle:active{transform:scale(.95)}
.estimate-circle .ring{
  position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);
}
.estimate-circle .ring-track{
  fill:none;stroke:rgba(255,255,255,.09);stroke-width:2.4;
}
.estimate-circle .ring-progress{
  fill:none;stroke:url(#ringGrad);stroke-width:2.6;stroke-linecap:round;
  stroke-dasharray:131.95;stroke-dashoffset:0;
  transition:stroke-dashoffset .95s linear;
  filter:drop-shadow(0 0 4px rgba(34,211,238,.6));
}
.estimate-circle .circle-time{
  font-size:10px;font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  z-index:1;
  background:linear-gradient(135deg,#a5f3fc,#c4b5fd);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.estimate-circle.is-urgent{
  border-color:rgba(251,191,36,.55);
  box-shadow:0 0 0 0 rgba(251,191,36,.25), 0 6px 20px rgba(251,191,36,.28);
  animation:urgentPulse 1.4s ease-in-out infinite;
}
.estimate-circle.is-urgent .ring-progress{stroke:#fbbf24}
.estimate-circle.is-urgent .circle-time{
  background:linear-gradient(135deg,#fbbf24,#f43f5e);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
@keyframes urgentPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.30), 0 6px 20px rgba(251,191,36,.28)}
  50%{box-shadow:0 0 0 6px rgba(251,191,36,0), 0 6px 22px rgba(251,191,36,.42)}
}

/* Popover */
.estimate-popover{
  position:absolute;
  top:calc(100% + 10px);
  right:0;
  background:linear-gradient(180deg, rgba(13,19,32,.98), rgba(9,13,22,.98));
  border:1px solid rgba(34,211,238,.30);
  border-radius:14px;
  padding:12px 14px;
  min-width:200px;
  box-shadow:0 16px 44px rgba(0,0,0,.65), 0 0 0 1px rgba(34,211,238,.08);
  z-index:80;
  animation:popIn .22s cubic-bezier(.16,1,.3,1);
  transform-origin:top right;
}
@keyframes popIn{
  from{opacity:0;transform:translateY(-6px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.estimate-popover::before{
  content:'';position:absolute;
  top:-6px;right:16px;
  width:11px;height:11px;
  background:rgba(13,19,32,.98);
  border-left:1px solid rgba(34,211,238,.30);
  border-top:1px solid rgba(34,211,238,.30);
  transform:rotate(45deg);
}
.popover-header{
  display:flex;align-items:center;gap:6px;
  font-size:10px;font-weight:800;
  color:#9fdcef;
  text-transform:uppercase;letter-spacing:.09em;
  margin-bottom:8px;
}
.popover-header .ic{color:#67e8f9}
.popover-time{
  font-size:22px;font-weight:800;
  line-height:1.05;
  letter-spacing:-.02em;
  background:linear-gradient(135deg,#67e8f9,#a78bfa);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.popover-unit{
  font-size:11.5px;font-weight:700;color:var(--muted);
  margin-left:4px;letter-spacing:.02em;
}
.popover-note{
  margin-top:7px;
  font-size:11px;
  color:#9fb0c6;
  line-height:1.5;
  display:flex;align-items:center;gap:5px;
}
.popover-note .mini-dot{
  width:5px;height:5px;border-radius:999px;background:#34d399;flex:none;
  box-shadow:0 0 6px rgba(52,211,153,.9);
  animation:pulse 1.4s ease-in-out infinite;
}

/* ============ THIN PROGRESS LINE ============ */
.countdown-line{
  height:2px;
  background:rgba(255,255,255,.05);
  overflow:hidden;
  flex:none;
  position:relative;
  z-index:39;
}
.countdown-line-fill{
  height:100%;
  background:linear-gradient(90deg,#22d3ee,#a78bfa);
  transition:width .95s linear, background .4s;
  box-shadow:0 0 8px rgba(34,211,238,.7);
  width:100%;
}
.countdown-line.is-urgent .countdown-line-fill{
  background:linear-gradient(90deg,#fbbf24,#f43f5e);
  box-shadow:0 0 8px rgba(244,63,94,.7);
}

/* ============ CHAT BODY (only scrollable area) ============ */
.chat-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px 16px 12px;
  display:flex;flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
  position:relative;
}
@media (min-width:640px){
  .chat-body{padding:22px 20px 14px;}
}

.empty-chat{
  margin:auto;
  text-align:center;
  padding:20px;
  max-width:340px;
}
.empty-chat-icon{
  width:64px;height:64px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(99,102,241,.12));
  border:1px solid rgba(34,211,238,.25);
  color:var(--cyan-soft);
  animation:floaty 3.6s ease-in-out infinite;
  box-shadow:0 12px 32px rgba(34,211,238,.15);
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.empty-chat h3{font-size:15px;font-weight:800;color:#fff;margin-bottom:6px}
.empty-chat p{font-size:12.5px;color:var(--muted);line-height:1.6}

/* Message row */
.msg-row{
  display:flex;gap:10px;align-items:flex-end;
  animation:msgIn .3s cubic-bezier(.16,1,.3,1);
}
.msg-row.user{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg-avatar{
  width:32px;height:32px;border-radius:999px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;
  background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(99,102,241,.14));
  border:1px solid rgba(34,211,238,.25);
  color:var(--cyan-soft);
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  letter-spacing:.01em;
}

.msg-content{
  max-width:78%;
  display:flex;flex-direction:column;
}
.msg-row.user .msg-content{align-items:flex-end}

.msg-name{
  font-size:10px;font-weight:700;color:var(--dim);
  margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;
}
.msg-name.is-agent{
  color:#a5f3fc;
  font-weight:800;
  letter-spacing:.05em;
}

.msg-bubble{
  padding:11px 14px;
  border-radius:16px;
  font-size:13.5px;
  line-height:1.55;
  word-wrap:break-word;
  word-break:break-word;
  white-space:pre-wrap;
}
.msg-row.user .msg-bubble{
  background:linear-gradient(135deg,#22d3ee,#3b82f6);
  color:#04121a;
  border-bottom-right-radius:5px;
  font-weight:600;
  box-shadow:0 6px 18px rgba(34,211,238,.22);
}
.msg-row.admin .msg-bubble{
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  color:var(--text);
  border-bottom-left-radius:5px;
}
.msg-row.admin.auto .msg-bubble{
  background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(99,102,241,.06));
  border-color:rgba(34,211,238,.22);
  color:#cbeef7;
}

.msg-time{
  font-size:10px;
  color:var(--dim);
  margin-top:5px;
  font-weight:600;
  letter-spacing:.02em;
}

/* ============ INPUT BAR ============ */
.chat-input-bar{
  flex:none;
  display:flex;align-items:flex-end;gap:10px;
  padding:12px 14px;
  border-top:1px solid var(--line);
  background:rgba(0,0,0,.22);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.chat-input-wrap{
  flex:1;
  position:relative;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:16px;
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.chat-input-wrap:focus-within{
  border-color:rgba(34,211,238,.5);
  background:rgba(34,211,238,.05);
  box-shadow:0 0 0 3px rgba(34,211,238,.08);
}
#chatInput{
  width:100%;
  background:transparent;
  border:none;
  outline:none;
  resize:none;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  line-height:1.5;
  padding:12px 14px;
  max-height:120px;
  overflow-y:auto;
  display:block;
}
#chatInput::placeholder{color:#5b6879}

.send-btn{
  width:44px;height:44px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#22d3ee,#3b82f6);
  color:#04121a;
  border:none;cursor:pointer;
  transition:transform .16s ease,box-shadow .22s ease,opacity .2s ease;
  box-shadow:0 8px 22px rgba(34,211,238,.28);
}
.send-btn:hover{box-shadow:0 12px 28px rgba(34,211,238,.42)}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{
  opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;
}

.pulse-dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {

    authDomain: "winkom-da4c2.firebaseapp.com",
    projectId: "winkom-da4c2",
    storageBucket: "winkom-da4c2.firebasestorage.app",
    messagingSenderId: "629229462242",
    appId: "1:629229462242:web:5ca49b09a8a5aadf92f4bb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ============================================================
   SUPPORT AGENT NAMES
   ============================================================ */
const AGENT_NAMES = [
  'Neha K', 'Priya J', 'Kajal R', 'Simi R', 'Riya S',
  'Anjali M', 'Pooja V', 'Sneha T', 'Divya N', 'Meera B',
  'Kavya L', 'Aisha K',
  'Rahul S', 'Arjun M', 'Vikram R', 'Aditya K', 'Rohan P',
  'Karan T', 'Sameer B', 'Nikhil V'
];

function pickRandomAgentName() {
    return AGENT_NAMES[Math.floor(Math.random() * AGENT_NAMES.length)];
}

function initialsFrom(name) {
    if (!name) return '';
    return name.split(/\s+/).filter(Boolean).slice(0, 2)
        .map(w => w.charAt(0).toUpperCase()).join('');
}

let currentUser = null;
let chatDocRef = null;
let messagesCollectionRef = null;
let unsubscribeChat = null;
let unsubscribeMessages = null;

let chatExists = false;
let currentMessages = [];
let chatCreatedThisSession = false;
let sendingMessage = false;
let currentAgentName = null;

/* ============================================================
   SIDEBAR / LOGOUT
   ============================================================ */
window.toggleSidebar = function () {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    if (sidebar.classList.contains('sidebar-closed')) {
        sidebar.classList.remove('sidebar-closed');
        sidebar.classList.add('sidebar-open');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('sidebar-closed');
        sidebar.classList.remove('sidebar-open');
        overlay.classList.add('hidden');
    }
};

window.handleLogout = async function () {
    await signOut(auth);
    window.location.href = 'login.html';
};

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, m => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));
}

function fmtTime(date) {
    if (!date) return '';
    const d = date instanceof Date ? date : new Date(date);
    let h = d.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${h}:${m} ${ampm}`;
}

function fmtDateTime(date) {
    if (!date) return '';
    const d = date instanceof Date ? date : new Date(date);
    const day = d.getDate();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${day} ${months[d.getMonth()]}, ${fmtTime(d)}`;
}

function toDateSafe(v) {
    if (!v) return null;
    if (v.toDate) return v.toDate();
    const d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
}

function randomEstimateMinutes() {
    return 1 + Math.floor(Math.random() * 60);
}

/* ============================================================
   HEADER STATE — WHO IS ON CHAT
   ============================================================ */
function updateHeaderStatus() {
    const statusEl = document.getElementById('headerStatus');
    const titleEl = document.getElementById('headerTitle');
    const avatarIcon = document.getElementById('headerAvatarIcon');
    const avatarInitials = document.getElementById('headerAvatarInitials');
    if (!statusEl) return;

    const hasAdminReply = currentMessages.some(m => m.sender === 'admin');

    if (hasAdminReply && currentAgentName) {
        // Agent joined → lock name in the header
        statusEl.innerHTML = `<span class="agent-name">${escapeHtml(currentAgentName)}</span> · Online`;
        if (titleEl) titleEl.textContent = currentAgentName;
        if (avatarIcon) avatarIcon.setAttribute('hidden', '');
        if (avatarInitials) {
            avatarInitials.textContent = initialsFrom(currentAgentName);
            avatarInitials.removeAttribute('hidden');
        }
    } else {
        // Before any reply → professional, neutral
        statusEl.textContent = 'Support Team · Online';
        if (titleEl) titleEl.textContent = 'Customer Support';
        if (avatarIcon) avatarIcon.removeAttribute('hidden');
        if (avatarInitials) {
            avatarInitials.setAttribute('hidden', '');
            avatarInitials.textContent = '';
        }
    }
}

/* ============================================================
   COUNTDOWN
   ============================================================ */
const countdown = {
    timerId: null,
    endAt: 0,
    totalMs: 0,
    estimateMin: 0,
    lastUserMsgId: null,
    active: false,
};

const RING_CIRC = 2 * Math.PI * 21;

function showCountdown() {
    const circle = document.getElementById('estimateCircle');
    const line = document.getElementById('countdownLine');
    if (circle) circle.hidden = false;
    if (line) line.hidden = false;
    if (!countdown.active) {
        if (circle) {
            circle.style.animation = 'none';
            void circle.offsetWidth;
            circle.style.animation = '';
        }
        countdown.active = true;
    }
}

function hideCountdown() {
    const circle = document.getElementById('estimateCircle');
    const line = document.getElementById('countdownLine');
    const popover = document.getElementById('estimatePopover');
    if (circle) circle.hidden = true;
    if (line) line.hidden = true;
    if (popover) popover.hidden = true;
    countdown.active = false;
}

function formatMMSS(ms) {
    const totalSec = Math.max(0, Math.ceil(ms / 1000));
    const mm = Math.floor(totalSec / 60);
    const ss = totalSec % 60;
    return `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}

function updateCountdownUI(remainingMs) {
    const circle = document.getElementById('estimateCircle');
    const circleTime = document.getElementById('circleTime');
    const ringProgress = document.getElementById('ringProgress');
    const line = document.getElementById('countdownLine');
    const lineFill = document.getElementById('countdownLineFill');
    const popoverTime = document.getElementById('popoverTime');
    const popoverUnit = document.getElementById('popoverUnit');
    const popoverNote = document.getElementById('popoverNote');

    const totalMs = countdown.totalMs || 1;
    const remaining = Math.max(0, remainingMs);
    const pct = Math.max(0, Math.min(1, remaining / totalMs));

    if (circleTime) circleTime.textContent = formatMMSS(remaining);
    if (ringProgress) ringProgress.style.strokeDashoffset = String(RING_CIRC * (1 - pct));
    if (lineFill) lineFill.style.width = (pct * 100) + '%';

    const urgent = remaining > 0 && remaining < 3 * 60 * 1000;
    if (circle) circle.classList.toggle('is-urgent', urgent);
    if (line) line.classList.toggle('is-urgent', urgent);

    if (popoverTime) popoverTime.textContent = String(countdown.estimateMin);
    if (popoverUnit) popoverUnit.textContent = countdown.estimateMin === 1 ? 'minute' : 'minutes';
    if (popoverNote) {
        if (remaining <= 0) {
            popoverNote.innerHTML = '<span class="mini-dot" style="background:#fbbf24;box-shadow:0 0 6px rgba(251,191,36,.9)"></span><span>Refreshing estimate…</span>';
        } else {
            const remMin = Math.max(1, Math.ceil(remaining / 60000));
            popoverNote.innerHTML = `<span class="mini-dot"></span><span>About ${remMin} min remaining</span>`;
        }
    }
}

function tickCountdown() {
    let remaining = countdown.endAt - Date.now();
    if (remaining <= 0) {
        const newMin = randomEstimateMinutes();
        countdown.estimateMin = newMin;
        countdown.totalMs = newMin * 60 * 1000;
        countdown.endAt = Date.now() + countdown.totalMs;
        remaining = countdown.totalMs;

        const circle = document.getElementById('estimateCircle');
        if (circle) {
            circle.style.animation = 'none';
            void circle.offsetWidth;
            circle.style.animation = '';
        }
    }
    updateCountdownUI(remaining);
}

function startCountdownTimer() {
    clearCountdownTimer();
    tickCountdown();
    countdown.timerId = setInterval(tickCountdown, 1000);
}

function clearCountdownTimer() {
    if (countdown.timerId) {
        clearInterval(countdown.timerId);
        countdown.timerId = null;
    }
}

function syncCountdown() {
    const userMsgs = currentMessages.filter(m => m.sender === 'user');
    if (!userMsgs.length) {
        clearCountdownTimer();
        countdown.lastUserMsgId = null;
        hideCountdown();
        return;
    }

    const lastUser = userMsgs[userMsgs.length - 1];
    const lastUserTime = toDateSafe(lastUser.createdAt);
    if (!lastUserTime) { hideCountdown(); return; }

    const adminRepliedAfter = currentMessages.some(m => {
        if (m.sender !== 'admin') return false;
        if (m.isAutoReply === true) return false;
        const t = toDateSafe(m.createdAt);
        return t && t > lastUserTime;
    });

    if (adminRepliedAfter) {
        clearCountdownTimer();
        countdown.lastUserMsgId = null;
        hideCountdown();
        return;
    }

    const storedMin =
        (typeof lastUser.replyEstimateMin === 'number' && lastUser.replyEstimateMin > 0)
            ? lastUser.replyEstimateMin
            : randomEstimateMinutes();

    if (countdown.lastUserMsgId !== lastUser.id) {
        countdown.lastUserMsgId = lastUser.id;
        countdown.estimateMin = storedMin;
        countdown.totalMs = storedMin * 60 * 1000;
        countdown.endAt = lastUserTime.getTime() + countdown.totalMs;

        if (countdown.endAt <= Date.now()) {
            const newMin = randomEstimateMinutes();
            countdown.estimateMin = newMin;
            countdown.totalMs = newMin * 60 * 1000;
            countdown.endAt = Date.now() + countdown.totalMs;
        }

        showCountdown();
        startCountdownTimer();
        return;
    }

    if (!countdown.timerId) {
        showCountdown();
        startCountdownTimer();
    }
}

/* ============================================================
   POPOVER
   ============================================================ */
function wireEstimateCircle() {
    const circle = document.getElementById('estimateCircle');
    const popover = document.getElementById('estimatePopover');
    if (!circle || !popover) return;

    circle.addEventListener('click', (e) => {
        e.stopPropagation();
        popover.hidden = !popover.hidden;
    });

    document.addEventListener('click', (e) => {
        if (popover.hidden) return;
        const wrap = circle.parentElement;
        if (!wrap.contains(e.target)) popover.hidden = true;
    });
}

/* ============================================================
   CHAT INIT
   ============================================================ */
function initChat() {
    chatDocRef = doc(db, 'supportChats', currentUser.uid);
    messagesCollectionRef = collection(db, 'supportChats', currentUser.uid, 'messages');

    unsubscribeChat = onSnapshot(chatDocRef, (docSnap) => {
        const wasExisting = chatExists;
        chatExists = docSnap.exists();

        if (!chatExists) {
            currentMessages = [];
            currentAgentName = null;
            clearCountdownTimer();
            countdown.lastUserMsgId = null;
            hideCountdown();
            renderMessages();
            updateHeaderStatus();
        } else {
            const data = docSnap.data() || {};
            if (data.agentName) {
                currentAgentName = data.agentName;
            } else if (!currentAgentName) {
                currentAgentName = pickRandomAgentName();
                updateDoc(chatDocRef, { agentName: currentAgentName }).catch(() => {});
            }
            if (!wasExisting) renderMessages();
            updateHeaderStatus();
        }
    }, (err) => {
        console.error('Chat doc listener error:', err);
    });

    const q = query(messagesCollectionRef, orderBy('createdAt', 'asc'));
    unsubscribeMessages = onSnapshot(q, (snap) => {
        currentMessages = [];
        snap.forEach(d => currentMessages.push({ id: d.id, ...d.data() }));
        renderMessages();
        syncCountdown();
        updateHeaderStatus();
    }, (err) => {
        console.error('Messages listener error:', err);
    });
}

/* ============================================================
   RENDER MESSAGES
   ============================================================ */
function renderMessages() {
    const body = document.getElementById('chatBody');
    if (!body) return;

    if (!chatExists) {
        body.innerHTML = `
            <div class="empty-chat">
                <div class="empty-chat-icon">
                    <svg class="ic" style="width:28px;height:28px" viewBox="0 0 24 24">
                        <path d="M21 12a8.5 8.5 0 0 1-8.5 8.5H4.2a1.2 1.2 0 0 1-.85-2.05L5 17A8.5 8.5 0 1 1 21 12Z"/>
                        <path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>
                    </svg>
                </div>
                <h3>Start a conversation</h3>
                <p>Our support team is here to help. Send us a message and we'll get back to you as soon as possible.</p>
            </div>`;
        return;
    }

    if (currentMessages.length === 0) {
        body.innerHTML = `
            <div class="empty-chat">
                <div class="empty-chat-icon">
                    <svg class="ic" style="width:28px;height:28px" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7.4V12l3.2 2"/>
                    </svg>
                </div>
                <h3>Just a moment…</h3>
                <p>We're connecting you with our support team.</p>
            </div>`;
        return;
    }

    body.innerHTML = currentMessages.map(renderMessageRow).join('');
    scrollToBottom();
}

function renderMessageRow(msg) {
    const isUser = msg.sender === 'user';
    const isAuto = msg.isAutoReply === true;
    const dt = toDateSafe(msg.createdAt);
    const timeStr = dt ? fmtDateTime(dt) : '';

    const userInitials = currentUser?.displayName?.trim()?.charAt(0)?.toUpperCase() || 'Y';
    const agentLabel = currentAgentName || 'WinKom Support';
    const agentInitials = currentAgentName ? initialsFrom(currentAgentName) : null;

    const avatarHtml = isUser
        ? `<div class="msg-avatar">${escapeHtml(userInitials)}</div>`
        : agentInitials
            ? `<div class="msg-avatar">${escapeHtml(agentInitials)}</div>`
            : `<div class="msg-avatar">
                 <svg class="ic ic-xs" viewBox="0 0 24 24" style="stroke-width:2">
                   <path d="M4.2 13.2v-1.4a7.8 7.8 0 0 1 15.6 0v1.4"/>
                   <path d="M4.2 13.2h1.9a1 1 0 0 1 1 1v3.6a1 1 0 0 1-1 1H5.2a1 1 0 0 1-1-1z"/>
                   <path d="M19.8 13.2h-1.9a1 1 0 0 0-1 1v3.6a1 1 0 0 0 1 1h.9a1 1 0 0 0 1-1z"/>
                 </svg>
               </div>`;

    return `
    <div class="msg-row ${isUser ? 'user' : 'admin'} ${isAuto ? 'auto' : ''}">
        ${avatarHtml}
        <div class="msg-content">
            <span class="msg-name ${!isUser && currentAgentName ? 'is-agent' : ''}">
                ${escapeHtml(isUser ? 'You' : agentLabel)}
            </span>
            <div class="msg-bubble">${escapeHtml(msg.text || '')}</div>
            ${timeStr ? `<span class="msg-time">${escapeHtml(timeStr)}</span>` : ''}
        </div>
    </div>`;
}

function scrollToBottom() {
    const body = document.getElementById('chatBody');
    if (!body) return;
    requestAnimationFrame(() => {
        body.scrollTop = body.scrollHeight;
    });
}

/* ============================================================
   SEND MESSAGE
   ============================================================ */
async function sendMessage() {
    if (!currentUser || sendingMessage) return;

    const input = document.getElementById('chatInput');
    const text = (input.value || '').trim();
    if (!text) return;

    sendingMessage = true;
    updateSendButton();

    input.value = '';
    input.style.height = 'auto';

    try {
        const isFirstMessage = !chatExists && !chatCreatedThisSession;
        const estimateMin = randomEstimateMinutes();

        if (isFirstMessage) {
            chatCreatedThisSession = true;

            const assignedAgent = currentAgentName || pickRandomAgentName();
            currentAgentName = assignedAgent;

            await setDoc(chatDocRef, {
                uid: currentUser.uid,
                userName: currentUser.displayName || 'User',
                userEmail: currentUser.email || '',
                agentName: assignedAgent,
                status: 'open',
                createdAt: serverTimestamp(),
                lastMessageAt: serverTimestamp()
            });

            await addDoc(messagesCollectionRef, {
                sender: 'user',
                text: text,
                replyEstimateMin: estimateMin,
                createdAt: serverTimestamp()
            });

            setTimeout(async () => {
                try {
                    await addDoc(messagesCollectionRef, {
                        sender: 'admin',
                        text:
`👋 Thanks for reaching out! We've received your message.

${assignedAgent} from our support team will get back to you shortly. You can check the estimated reply time at the top of this chat.`,
                        isAutoReply: true,
                        createdAt: serverTimestamp()
                    });
                    await updateDoc(chatDocRef, { lastMessageAt: serverTimestamp() });
                } catch (e) {
                    console.error('Auto-reply error:', e);
                }
            }, 700);

        } else {
            await addDoc(messagesCollectionRef, {
                sender: 'user',
                text: text,
                replyEstimateMin: estimateMin,
                createdAt: serverTimestamp()
            });
            await updateDoc(chatDocRef, { lastMessageAt: serverTimestamp() });
        }

    } catch (err) {
        console.error('Send message failed:', err);
        input.value = text;
        autoResizeInput();
        updateSendButton();
        alert('Could not send your message. Please check your connection and try again.');
    } finally {
        sendingMessage = false;
        updateSendButton();
        input.focus();
    }
}

/* ============================================================
   INPUT
   ============================================================ */
function autoResizeInput() {
    const input = document.getElementById('chatInput');
    if (!input) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

function updateSendButton() {
    const btn = document.getElementById('sendBtn');
    const input = document.getElementById('chatInput');
    if (!btn || !input) return;
    const hasText = input.value.trim().length > 0;
    btn.disabled = !hasText || sendingMessage;
}

function wireInput() {
    const input = document.getElementById('chatInput');
    const btn = document.getElementById('sendBtn');

    input.addEventListener('input', () => {
        autoResizeInput();
        updateSendButton();
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (!btn.disabled) sendMessage();
        }
    });

    btn.addEventListener('click', () => {
        if (!btn.disabled) sendMessage();
    });
}

/* ============================================================
   AUTH
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
    if (!user) {
        window.location.href = 'login.html';
        return;
    }
    currentUser = user;
