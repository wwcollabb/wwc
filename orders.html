<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — KashRun</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="KashRun logo" onerror="this.style.display='none'">
      <div class="brand-text"><span class="brand-name">KashRun</span><span class="brand-tagline">Everything Kashmir Needs</span></div>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" aria-label="Cart">🛍<span class="icon-badge" data-cart-count style="display:none">0</span></a>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 class="page-title" style="font-size:1.8rem">My Orders</h1>
    <nav class="account-nav">
      <a href="account.html">Profile</a>
      <a href="orders.html" class="active">My Orders</a>
      <a href="wishlist.html">Wishlist</a>
    </nav>
    <div id="orders-root"><div class="spinner"></div></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/cart.js"></script>
<script>
  async function init() {
    const user = await krRequireAuth();
    if (!user) return;

    const orders = await krFetchOrders();
    const root = document.getElementById("orders-root");

    if (orders.length === 0) {
      root.innerHTML = `<div class="empty-state"><h3>No orders yet</h3><p>Once you place an order, it'll show up here.</p><a href="products.html" class="btn btn-primary" style="margin-top:16px">Start Shopping</a></div>`;
      return;
    }

    root.innerHTML = orders.map(o => `
      <a href="order-details.html?id=${o.id}" class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px;flex-wrap:wrap">
        <div>
          <strong style="font-family:var(--font-mono)">#${o.id.slice(0, 8).toUpperCase()}</strong>
          <div style="font-size:.82rem;color:var(--stone);margin-top:4px">${new Date(o.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-mono);font-weight:700">${krFormatPrice(o.total_amount)}</div>
          <div style="margin-top:4px">${krStatusBadge(o.status)}</div>
        </div>
      </a>`).join("");
  }
  init();
</script>
</body>
</html>
